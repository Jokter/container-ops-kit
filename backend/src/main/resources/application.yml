spring:
  datasource:
    url: jdbc:h2:file:./data/resource-center;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8080
deployment:
  kubectl-kubeconfig: /root/.kube/config
  helm-kubeconfig: /opt/kubeconfig/kubeconfig.txt
  lock-file: /opt/pkg_version/lock.json
  jar-list-file: /opt/pkg_version/jarlist.json
logging:
  file:
    name: logs/container-ops-kit.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/container-ops-kit.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
resource-center:
  ssh:
    connect-timeout: 5000
    auth-timeout: 5000
    batch-concurrency: 5
build:
  arch-build-dir-template: Chart/{module}
  modules:
    - name: mae-access
      charts-path: mae-access-base-features-charts/chartTool/charts
    - name: mae-common
      charts-path: mae-common-feature-charts/chartTool/charts
    - name: mae-commonan
      charts-path: assurance-common-feature-charts/chartTool/charts
    - name: mae-datapulse
      charts-path: datapulse-charts/chartTool/charts
    - name: mae-devicehealthcheck
      charts-path: devicehealthcheck-charts/chartTool/charts
    - name: mae-fmemate
      charts-path: fmemate-charts/chartTool/charts
    - name: mae-ifaultcare
      charts-path: ifaultcare-charts/chartTool/charts
    - name: mae-optimization
      charts-path: optimization-feature-charts/chartTool/charts
  ssh:
    command-timeout: 1800000
auto-ut:
  log-directory: ./data/auto-ut/logs
  language: Java
  pl-group: Access_智能监控组
  repair:
    command: pi
    thinking-level: medium
    timeout-minutes: 30
    max-attempts-per-run: 3
  guard:
    forbidden-markers:
      - "@Disabled"
      - "@Ignore"
  scm:
    command: codehub-cli
    create-merge-request: true
    reviewers: ${AUTO_UT_CODEHUB_REVIEWERS:}
    approvers: ${AUTO_UT_CODEHUB_APPROVERS:}
    assignees: ${AUTO_UT_CODEHUB_ASSIGNEES:}
  repository-template:
    url: "ssh://git@szv-y.codehub.huawei.com:2222/MAE-M/Access/{repository}.git"
    test-command:
      - mvn
      - -B
      - -ntp
      - clean
      - test
    verification-command:
      - mvn
      - -B
      - -ntp
      - clean
      - org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
      - test
      - org.jacoco:jacoco-maven-plugin:0.8.12:report
    coverage-report: target/site/jacoco/jacoco.xml
  repositories: {}
