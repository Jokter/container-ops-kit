<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运维平台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --ink: #202b33;
      --muted: #66737d;
      --faint: #8e99a2;
      --line: #e1e6e9;
      --brand: #3563e9;
      --brand-soft: #edf2ff;
      --green: #16836e;
      --green-soft: #e9f5f2;
      --violet: #5267c7;
      --violet-soft: #eef1fb;
      --amber: #a96f16;
      --amber-soft: #fff4df;
      --red: #c64c4c;
      --red-soft: #fff0ef;
      --shadow: 0 1px 2px rgba(25, 39, 48, .04);
      --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 14px/1.55 var(--font); font-weight: 400; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    strong, b { font-weight: 600; }
    h1 { font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -.02em; }
    h2 { font-size: 16px; line-height: 1.35; font-weight: 600; }
    h3 { font-size: 14px; font-weight: 600; }
    .mono { font-family: var(--mono); }
    .taiji { width: 30px; height: 30px; flex: 0 0 auto; }
    .taiji svg { display: block; width: 100%; height: 100%; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .status.ok { color: var(--green); }
    .status.ok::before { background: var(--green); }
    .status.warn { color: var(--amber); }
    .status.warn::before { background: var(--amber); }
    .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 99px; color: var(--muted); background: #eef1f3; font-size: 12px; font-weight: 500; }
    .badge.brand { color: var(--brand); background: var(--brand-soft); }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.violet { color: var(--violet); background: var(--violet-soft); }
    .badge.amber { color: var(--amber); background: var(--amber-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .button { border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; color: var(--ink); background: var(--surface); font-weight: 500; }
    .button:hover { border-color: #b9c3c9; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button.primary { color: white; border-color: var(--brand); background: var(--brand); }
    .button.ghost { color: var(--muted); background: transparent; }
    .button.small { padding: 6px 9px; font-size: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 49px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel-body { padding: 16px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .page-head p { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .metric-value { font-size: 26px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-foot { margin-top: 3px; color: var(--faint); font-size: 12px; }
    .attention-list, .activity-list { display: grid; }
    .attention-row, .activity-row { display: grid; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .attention-row:last-child, .activity-row:last-child { border-bottom: 0; }
    .attention-row { grid-template-columns: auto minmax(0,1fr) auto; }
    .attention-row strong, .activity-row strong { display: block; font-size: 14px; font-weight: 500; }
    .attention-row p, .activity-row p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .activity-row { grid-template-columns: 58px minmax(0,1fr) auto; }
    .activity-time { color: var(--faint); font: 12px var(--mono); }
    .workspace-tabs { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
    .workspace-tabs button { border: 0; border-radius: 8px; padding: 8px 12px; color: var(--muted); background: transparent; font-weight: 500; }
    .workspace-tabs button.active { color: var(--brand); background: var(--brand-soft); }
    .environment-bar { display: grid; grid-template-columns: minmax(220px,1.2fr) repeat(4,minmax(100px,.7fr)) auto; gap: 16px; align-items: center; margin-bottom: 16px; padding: 15px 17px; border-radius: 10px; color: white; background: #253744; }
    .environment-bar strong { display: block; }
    .environment-bar small { display: block; margin-top: 3px; color: #b9c4cb; font-size: 12px; }
    .environment-bar select { width: 100%; border: 1px solid #50616c; border-radius: 7px; padding: 8px 9px; color: white; background: #314550; font-weight: 500; }
    .environment-item span { display: block; color: #9baab3; font-size: 12px; }
    .environment-item b { display: block; margin-top: 3px; font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--ink); background: var(--surface-soft); }
    .repo-list { display: grid; gap: 9px; margin-top: 15px; }
    .repo-row { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px; border-radius: 9px; background: var(--surface-soft); }
    .repo-row span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .repo-row-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    .repo-row-title span { margin-bottom: 0; }
    .repo-row > * { min-width: 0; }
    .repo-row input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; background: white; }
    .build-layout { display: grid; grid-template-columns: 390px minmax(0,1fr); gap: 16px; align-items: start; }
    .summary-stack { display: grid; gap: 14px; }
    .progress { height: 7px; overflow: hidden; border-radius: 99px; background: #e8ecef; }
    .progress span { display: block; width: 62%; height: 100%; background: var(--brand); }
    .terminal { min-height: 210px; padding: 15px; border-radius: 9px; color: #c2ccd2; background: #1d2b34; font: 12px/1.75 var(--mono); }
    .terminal b { color: #7ed2c3; }
    .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .resource-card { padding: 19px; }
    .resource-card-top { display: flex; justify-content: space-between; gap: 12px; }
    .resource-card p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .connection-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 16px; }
    .connection { padding: 11px; border-radius: 8px; background: var(--surface-soft); }
    .connection span { color: var(--muted); font-size: 12px; }
    .connection strong { display: block; margin-top: 4px; font-size: 12px; }
    .empty { min-height: 420px; display: grid; place-items: center; text-align: center; }
    .empty-symbol { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 16px; color: var(--violet); background: var(--violet-soft); font-size: 24px; }
    .empty p { max-width: 470px; margin-top: 7px; color: var(--muted); }
    .variant-a-shell { min-height: 100vh; }
    .variant-a-sidebar { position: fixed; inset: 0 auto 0 0; width: 184px; display: flex; flex-direction: column; padding: 18px 12px 14px; background: #f1f4f6; border-right: 1px solid var(--line); }
    .variant-a-brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 16px; }
    .variant-a-brand strong { display: block; white-space: nowrap; color: #263740; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
    .variant-a-brand span { display: block; margin-top: 1px; color: #7b8891; font-size: 12px; font-weight: 400; }
    .platform-switch { position: relative; margin: 0 1px 14px; }
    .platform-switch summary { min-height: 38px; display: flex; align-items: center; gap: 8px; border: 1px solid #d9dfe3; border-radius: 8px; padding: 7px 9px; color: var(--ink); background: rgba(255,255,255,.72); box-shadow: 0 1px 1px rgba(25,39,48,.03); cursor: pointer; list-style: none; }
    .platform-switch summary::-webkit-details-marker { display: none; }
    .platform-switch summary:hover, .platform-switch[open] summary { border-color: #b9c3c9; background: white; }
    .platform-symbol { width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 6px; color: var(--brand); background: var(--brand-soft); font-size: 12px; font-weight: 600; }
    .platform-label { min-width: 0; flex: 1; font-size: 13px; font-weight: 600; }
    .platform-chevron { color: var(--faint); font-size: 11px; transition: transform .15s ease; }
    .platform-switch[open] .platform-chevron { transform: rotate(180deg); }
    .platform-menu { position: absolute; top: calc(100% + 6px); right: 0; left: 0; z-index: 10; display: grid; gap: 3px; padding: 5px; border: 1px solid var(--line); border-radius: 9px; background: white; box-shadow: 0 12px 30px rgba(25,39,48,.14); }
    .platform-option { width: 100%; display: flex; align-items: center; gap: 9px; border: 0; border-radius: 6px; padding: 8px; color: var(--muted); background: transparent; text-align: left; }
    .platform-option:hover { color: var(--ink); background: var(--surface-soft); }
    .platform-option.active { color: var(--brand); background: var(--brand-soft); font-weight: 600; }
    .platform-option small { margin-left: auto; color: var(--faint); font-size: 11px; font-weight: 400; }
    .variant-a-nav { display: grid; gap: 2px; }
    .variant-a-nav .nav-section { margin: 14px 9px 4px; color: var(--faint); font-size: 12px; font-weight: 500; }
    .variant-a-nav button { width: 100%; border: 0; border-radius: 7px; padding: 8px 10px; color: #53616b; background: transparent; text-align: left; font-size: 14px; font-weight: 400; }
    .variant-a-nav button.active { color: var(--ink); background: white; box-shadow: inset 2px 0 var(--brand); font-weight: 600; }
    .variant-a-user { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .variant-a-main { min-height: 100vh; margin-left: 184px; padding: 24px; }
    .variant-a-status-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin-bottom: 16px; padding: 14px 0; }
    .variant-a-status-item { min-width: 0; padding: 0 18px; border-right: 1px solid var(--line); }
    .variant-a-status-item:first-child { padding-left: 16px; }
    .variant-a-status-item:last-child { border-right: 0; }
    .variant-a-status-top { display: flex; align-items: baseline; gap: 9px; }
    .variant-a-columns { display: grid; grid-template-columns: minmax(0,7fr) minmax(320px,5fr); gap: 16px; }
    .variant-a-overview { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 16px; }
    .platform-placeholder { min-height: calc(100vh - 48px); display: grid; place-items: center; text-align: center; }
    .platform-placeholder-content { max-width: 430px; padding: 48px; }
    .platform-placeholder-symbol { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; color: var(--brand); background: var(--brand-soft); font-size: 22px; font-weight: 600; }
    .platform-placeholder h1 { font-size: 24px; }
    .platform-placeholder p { margin-top: 8px; color: var(--muted); }
    .platform-boundary { display: inline-flex; margin-top: 18px; padding: 5px 9px; border-radius: 99px; color: var(--muted); background: #eef1f3; font-size: 12px; }
    .capability-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,360px)); gap: 16px; }
    .capability-card { min-height: 150px; padding: 20px; text-align: left; }
    .capability-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .capability-symbol { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: var(--brand); background: var(--brand-soft); font-weight: 700; }
    .capability-card p { margin-top: 16px; color: var(--muted); font-size: 13px; }
    .auto-ut-layout { display: grid; grid-template-columns: minmax(320px,.8fr) minmax(0,1.4fr); gap: 16px; align-items: start; }
    .auto-ut-file { display: grid; gap: 7px; margin-top: 14px; }
    .auto-ut-file input { width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: var(--surface-soft); }
    .auto-ut-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .auto-ut-list { display: grid; gap: 8px; }
    .auto-ut-row { display: grid; grid-template-columns: minmax(130px,1fr) minmax(190px,1.3fr) 110px; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .auto-ut-row:last-child { border-bottom: 0; }
    .auto-ut-row p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .auto-ut-row code { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-repository-editor { min-width: 0; display: flex; align-items: center; gap: 7px; }
    .auto-ut-repository-editor input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; color: var(--ink); background: white; font: 11px/1.4 "Cascadia Code",Consolas,monospace; }
    .auto-ut-workspace { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); text-align: left; }
    .auto-ut-workspace span:last-child { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-mode-control { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .auto-ut-mode-control .active { color: var(--ink); font-weight: 600; }
    .auto-ut-switch { position: relative; width: 38px; height: 22px; flex: 0 0 auto; border: 0; border-radius: 999px; padding: 0; background: #c9d1d6; cursor: pointer; transition: background .2s ease; }
    .auto-ut-switch span { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(25,39,48,.25); transition: transform .2s ease; }
    .auto-ut-switch[aria-checked="true"] { background: var(--brand); }
    .auto-ut-switch[aria-checked="true"] span { transform: translateX(16px); }
    .auto-ut-schedule-line { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .auto-ut-schedule-copy { min-width: 0; margin-right: auto; }
    .auto-ut-schedule-copy strong, .auto-ut-schedule-copy small { display: block; }
    .auto-ut-schedule-copy small { margin-top: 2px; color: var(--muted); }
    .auto-ut-schedule-line input[type="time"] { width: 104px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; background: white; }
    .auto-ut-directory-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(18,30,38,.34); }
    .auto-ut-directory-dialog { width: min(620px,100%); max-height: min(640px,80vh); display: flex; flex-direction: column; border-radius: 12px; background: white; box-shadow: 0 24px 70px rgba(18,30,38,.24); }
    .auto-ut-directory-head, .auto-ut-directory-footer { display: flex; align-items: center; gap: 9px; padding: 14px 16px; }
    .auto-ut-directory-head { border-bottom: 1px solid var(--line); }
    .auto-ut-directory-head strong { overflow: hidden; margin-right: auto; text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-directory-list { min-height: 220px; overflow: auto; padding: 8px; }
    .auto-ut-directory-entry { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 7px; padding: 10px; background: transparent; text-align: left; cursor: pointer; }
    .auto-ut-directory-entry:hover { background: var(--surface-soft); }
    .auto-ut-directory-footer { justify-content: flex-end; border-top: 1px solid var(--line); }
    .auto-ut-progress { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: var(--surface-soft); }
    .auto-ut-progress span { display: block; height: 100%; border-radius: inherit; background: var(--brand); transition: width .25s ease; }
    .auto-ut-task-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .auto-ut-live { grid-column: 1 / -1; min-width: 0; display: grid; gap: 8px; margin-top: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
    .auto-ut-live-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .auto-ut-live-head span { color: var(--muted); font-size: 12px; }
    .auto-ut-thinking { border: 1px solid var(--line); border-radius: 7px; background: white; }
    .auto-ut-thinking summary { padding: 9px 11px; color: var(--muted); cursor: pointer; user-select: none; }
    .auto-ut-thinking[open] summary { border-bottom: 1px solid var(--line); }
    .auto-ut-stream-block { min-width: 0; }
    .auto-ut-stream-block > strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .auto-ut-stream-text { max-height: 260px; overflow: auto; margin: 0; padding: 10px 11px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 7px; font: 12px/1.65 "Cascadia Code",Consolas,"Microsoft YaHei UI",monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-ut-thinking .auto-ut-stream-text { border: 0; border-radius: 0 0 7px 7px; }
    .auto-ut-tool-list { display: grid; gap: 6px; }
    .auto-ut-tool { padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    .auto-ut-tool-head { display: flex; align-items: center; gap: 8px; }
    .auto-ut-tool-head strong { font-size: 12px; }
    .auto-ut-tool-head span { margin-left: auto; color: var(--muted); font-size: 11px; }
    .auto-ut-tool.error .auto-ut-tool-head span { color: var(--red); }
    .auto-ut-tool pre { max-height: 180px; overflow: auto; margin: 7px 0 0; color: var(--muted); font: 11px/1.55 "Cascadia Code",Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-ut-operation-list { display: grid; gap: 5px; }
    .auto-ut-operation { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 7px; background: white; font-size: 12px; }
    .auto-ut-operation i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px rgba(25,114,120,.12); }
    .auto-ut-operation.done i { background: var(--green); box-shadow: none; }
    .auto-ut-operation.error i { background: var(--red); box-shadow: none; }
    .auto-ut-operation span { color: var(--muted); font-size: 11px; }
    .auto-ut-operation code { grid-column: 2 / -1; font-size: 10px; }
    .overview-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; }
    .overview-card p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .overview-card-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .task-table { margin-top: 16px; }
    .task-row { display: grid; grid-template-columns: minmax(220px,1.4fr) minmax(180px,1fr) minmax(160px,.8fr) 100px 70px; gap: 16px; align-items: center; min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .task-row:last-child { border-bottom: 0; }
    .task-row.head { min-height: 36px; color: var(--faint); background: var(--surface-soft); font-size: 12px; }
    .task-row strong { font-weight: 500; }
    .task-row span { color: var(--muted); font-size: 12px; }
    .resource-workspace { display: grid; gap: 16px; }
    .version-overview { display: grid; grid-template-columns: minmax(260px,1.4fr) repeat(3,minmax(150px,.6fr)); align-items: stretch; overflow: hidden; }
    .version-selector { padding: 16px; border-right: 1px solid var(--line); }
    .version-selector label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .version-selector select { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; color: var(--ink); background: var(--surface-soft); font-weight: 500; }
    .version-stat { display: flex; flex-direction: column; justify-content: center; padding: 16px 18px; border-right: 1px solid var(--line); }
    .version-stat:last-child { border-right: 0; }
    .version-stat span { color: var(--muted); font-size: 12px; }
    .version-stat strong { margin-top: 3px; font-size: 20px; }
    .resource-panel { overflow: hidden; }
    .resource-tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
    .resource-tabs button { position: relative; border: 0; padding: 9px 12px 11px; color: var(--muted); background: transparent; font-weight: 500; }
    .resource-tabs button.active { color: var(--brand); }
    .resource-tabs button.active::after { content: ""; position: absolute; right: 10px; bottom: -1px; left: 10px; height: 2px; background: var(--brand); }
    .resource-tab-count { margin-left: 5px; color: var(--faint); font-size: 12px; }
    .environment-toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .environment-search { min-width: 240px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; background: var(--surface-soft); }
    .environment-filter { border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; color: var(--muted); background: var(--surface); }
    .environment-toolbar-spacer { flex: 1; }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

      const rows = tasks.slice(0, 5).map(task => `<div class="task-row"><strong>${escapeHtml(task.id)}</strong><span>${escapeHtml(task.input)}</span><span>${escapeHtml(task.environment)}</span><span>${taskBadge(task)}</span><span>${escapeHtml(task.updated)}</span></div>`).join('');

    }

    function createTask(kind, input, environment, statusLabel = '执行中') {
      const id = `${kind}-${Date.now()}`;
      tasks.unshift({ id, kind, input, environment, status: 'running', statusLabel, updated: '刚刚' });

        task.status = 'success';
        task.statusLabel = kind === 'deploy' ? '已部署' : '成功';
        task.updated = '刚刚';
        render(false);
      }, 1800);
    }

作目录</label><input name="workdir" required value="${escapeHtml(source?.workdir || '')}" placeholder="/opt/cok"></div></div><div id="drawer-test-result" class="drawer-test-result" aria-live="polite"></div></section>${type === 'container' ? `<section class="drawer-section"><div class="drawer-section-title"><h3>容器连接</h3><p>MAE 与 OSMU 分别维护，不纳入 SSH 连接测试。</p></div><div class="drawer-grid"><div class="field"><label>MAE 地址</label><input name="mae" value="${escapeHtml(source?.mae || '')}" placeholder="mae-prod-01"></div><div class="field"><label>MAE 账号</label><input name="maeUser" value="${escapeHtml(source?.maeUser || '')}" placeholder="请输入账号"></div><div class="field wide"><label>MAE 密码</label><input name="maePassword" type="password" ${editing ? '' : 'required'} placeholder="${containerPasswordCopy(source?.maePasswordConfigured)}"></div><div class="field"><label>OSMU 地址</label><input name="osmu" value="${escapeHtml(source?.osmu || '')}" placeholder="osmu-prod-01"></div><div class="field"><label>OSMU 账号</label><input name="osmuUser" value="${escapeHtml(source?.osmuUser || '')}" placeholder="请输入账号"></div><div class="field wide"><label>OSMU 密码</label><input name="osmuPassword" type="password" ${editing ? '' : 'required'} placeholder="${containerPasswordCopy(source?.osmuPasswordConfigured)}"></div></div></section>` : ''}</form><div class="drawer-footer"><button class="button" data-close-drawer>取消</button><button class="button" data-drawer-test>测试连接</button><button class="button primary" data-save-environment>保存环境</button></div></aside>`;
    }

    function resourceContent() {
      const buildCount = versionEnvironments('build').length;

      const batch = state.batch ? `<div class="batch-progress"><strong>正在测试 ${state.batch.completed}/${state.batch.total}</strong><div class="batch-progress-track"><span style="width:${state.batch.total ? state.batch.completed / state.batch.total * 100 : 0}%"></span></div><span>${state.batch.passed} 成功 · ${state.batch.failed} 失败</span></div>` : '';

    }

    function commonPage(page) {
      if (page === 'build') return `${pageTitle('构建', '选择构建环境，配置仓库与分支，然后生成可部署产物。','<button class="button" data-page="resources">查看环境</button>')}${buildContent()}`;
      if (page === 'resources') return `${pageTitle('资源中心', '按发布版本维护构建环境和容器环境，并验证 SSH 连通性。', '<span class="badge">高保真模拟</span>')}${resourceContent()}`;
      if (page === 'deploy') return `${pageTitle('部署', '选择成功产物和容器环境，完成校验后部署。')}${containerEnvironmentBar()}<section class="panel empty"><div><div class="empty-symbol">⇧</div><h2>选择待部署产物</h2><p>部署只使用当前容器环境；当前可部署产物 2 个。</p><button class="button primary" style="margin-top:18px" data-create-deploy-task>选择产物</button></div></section>`;
      if (page === 'operations') return `${pageTitle('容器运维', '通过容器环境中的 MAE、OSMU 和唯一 OM 节点执行运维操作。')}${containerEnvironmentBar()}<section class="panel empty"><div><div class="empty-symbol">◇</div><h2>容器运维工作区</h2><p>具体工作负载、日志和操作能力将在后续需求中定义。</p><button class="button" data-page="resources" style="margin-top:18px">查看容器环境</button></div></section>`;
      return '';

    function dashboardA() {
      const buildEnvironments = environments.filter(item => item.type === 'build');
      const containerEnvironments = environments.filter(item => item.type === 'container');
      const onlineCount = environments.filter(item => item.status === 'online').length;
      const activeCount = environments.length;
      const queuedCount = tasks.filter(item => item.kind === 'build' && item.status === 'running').length;
      const deployCount = tasks.filter(item => item.kind === 'deploy' && item.status === 'running').length;
      const failedCount = tasks.filter(item => item.status === 'failed').length;
      return `${pageTitle('工作台', '集中查看任务、环境和需要处理的事项。','<button class="button">搜索</button><button class="button primary" data-page="build">新建构建</button>')}<section class="panel variant-a-status-strip"><div class="variant-a-status-item"><div class="variant-a-status-top"><strong class="metric-value">${queuedCount}</strong><span class="metric-label">构建队列</span></div><div class="metric-foot">${queuedCount ? '执行中的构建任务' : '当前没有执行中的构建任务'}</div></div><div class="variant-a-status-item"><div class="variant-a-status-top"><strong class="metric-value">${deployCount}</strong><span class="metric-label">部署中</span></div><div class="metric-foot">来自部署任务</div></div><div class="variant-a-status-item"><div class="variant-a-status-top"><strong class="metric-value">${onlineCount}/${activeCount}</strong><span class="metric-label">环境在线</span></div><div class="metric-foot">构建与容器环境实际状态</div></div><div class="variant-a-status-item"><div class="variant-a-status-top"><strong class="metric-value">${failedCount}</strong><span class="metric-label">失败任务</span></div><div class="metric-foot">需要关注的执行结果</div></div></section><div class="variant-a-columns"><section class="panel"><div class="panel-head"><h2>需要处理</h2><span class="badge brand">${failedCount} 项</span></div><div class="panel-body">${attentionRows()}</div></section><section class="panel"><div class="panel-head"><h2>最近活动</h2><button class="button small ghost">查看全部</button></div><div class="panel-body">${activityRows()}</div></section></div><div class="variant-a-overview"><button class="panel overview-card" data-resource-card="build"><div><h2>构建环境</h2><p>${buildEnvironments.length} 个可用环境</p></div><div class="overview-card-meta"><span>共 ${environments.filter(item => item.type === 'build').length} 个</span><span class="status ok">查看详情</span></div></button><button class="panel overview-card" data-resource-card="container"><div><h2>容器环境</h2><p>${containerEnvironments.length} 个可用环境</p></div><div class="overview-card-meta"><span>共 ${environments.filter(item => item.type === 'container').length} 个</span><span class="status warn">查看详情</span></div></button></div>${recentTasks()}`;
    }

    const autoUtStatus = {
      DISCOVERED: '待执行', WAITING_REPOSITORY: '仓库未配置', PREPARING: '准备工作区', BASELINE_RUNNING: '基线测试',
      REPAIRING: '修复中', VERIFYING: '验证中', WAITING_CONFIRMATION: '等待继续', RETRY_PENDING: '等待重试', WAITING_EXTERNAL: '等待处理',
      PR_CREATING: '创建 MR', RESOLVED: '已解决'
    };
    const autoUtStage = { PREPARE: '准备工作区', BASELINE: '基线 UT', REPAIR: 'Pi 修复', VERIFY: '完整验证', PUBLISH: '创建 CodeHub MR', DONE: '已完成' };
    const autoUtActiveStatus = new Set(['DISCOVERED', 'PREPARING', 'BASELINE_RUNNING', 'REPAIRING', 'VERIFYING', 'PR_CREATING']);
    const autoUtStreamableStatus = new Set([...autoUtActiveStatus, 'WAITING_CONFIRMATION', 'WAITING_EXTERNAL']);
    let autoUtPollTimer;
    let autoUtLiveRenderTimer;
    const autoUtEventSources = new Map();

    function autoUtLiveState(taskId) {
      return state.autoUtLive[taskId] ||= { sequence: 0, thinking: '', message: '', thinkingOpen: true, thinkingActive: false, status: '执行中', tools: {}, operations: {} };
    }

    function trimAutoUtOutput(value) {
      return value.length > 120000 ? value.slice(-120000) : value;
    }

    function applyAutoUtLiveEvent(taskId, event) {
      const live = autoUtLiveState(taskId);
      if (event.sequence && event.sequence <= live.sequence) return;
      live.sequence = Math.max(live.sequence, event.sequence || 0);
      if (event.type === 'thinking_start') { live.thinkingActive = true; live.thinkingOpen = true; }
      if (event.type === 'thinking_delta') live.thinking = trimAutoUtOutput(live.thinking + (event.content || ''));
      if (event.type === 'thinking_end') live.thinkingActive = false;
      if (event.type === 'message_start') live.thinkingOpen = false;
      if (event.type === 'message_delta') live.message = trimAutoUtOutput(live.message + (event.content || ''));
      if (event.type === 'status' || event.type === 'completed') live.status = event.content || live.status;
      if (event.type === 'error') { live.status = event.content || 'Pi 执行失败'; live.error = true; }
      if (event.type === 'operation_start') {
        live.operations[event.toolCallId] = { id: event.toolCallId, name: event.content, command: event.toolName, status: '执行中', error: false };
        live.status = event.content || live.status;
      }
      if (event.type === 'operation_end') {
        const operation = live.operations[event.toolCallId] ||= { id: event.toolCallId, name: event.content, command: '', status: '执行中', error: false };
        operation.status = event.error ? '失败' : '完成';
        operation.error = Boolean(event.error);
        live.status = event.error ? `${operation.name}失败` : `${operation.name}完成`;
      }
      if (event.type === 'tool_start') {
        live.tools[event.toolCallId] = { id: event.toolCallId, name: event.toolName, args: event.content, output: '', status: '执行中', error: false };
      }
      if (event.type === 'tool_output' || event.type === 'tool_end') {
        const tool = live.tools[event.toolCallId] ||= { id: event.toolCallId, name: event.toolName, args: '', output: '', status: '执行中', error: false };
        tool.output = trimAutoUtOutput(event.replace ? (event.content || '') : tool.output + (event.content || ''));
        if (event.type === 'tool_end') { tool.status = event.error ? '失败' : '完成'; tool.error = Boolean(event.error); }
      }
      clearTimeout(autoUtLiveRenderTimer);
      autoUtLiveRenderTimer = setTimeout(() => render(false), 50);
    }

    function connectAutoUtStream(taskId) {
      if (typeof EventSource !== 'function' || autoUtEventSources.has(taskId)) return;
      const after = state.autoUtLive[taskId]?.sequence || 0;
      const source = new EventSource(`/api/auto-ut/tasks/${encodeURIComponent(taskId)}/events?afterSequence=${after}`);
      source.onmessage = message => {
        try { applyAutoUtLiveEvent(taskId, JSON.parse(message.data)); }
        catch (error) { autoUtLiveState(taskId).status = '无法解析 Pi 实时事件'; }
      };
      autoUtEventSources.set(taskId, source);
    }

    function ensureAutoUtStreams() {
      if (state.platformDomain !== 'automation' || state.automationPage !== 'auto-ut') return;
      const latest = state.autoUtTasks.filter((task, index, tasks) => tasks.findIndex(candidate => candidate.repository === task.repository && candidate.reportVersion === task.reportVersion) === index);
      const streamableIds = new Set(latest.filter(task => autoUtStreamableStatus.has(task.status)).map(task => task.id));
      autoUtEventSources.forEach((source, taskId) => {
        if (!streamableIds.has(taskId)) { source.close(); autoUtEventSources.delete(taskId); }
      });
      latest.filter(task => streamableIds.has(task.id)).forEach(task => connectAutoUtStream(task.id));
    }

    function closeAutoUtStreams() {
      autoUtEventSources.forEach(source => source.close());
      autoUtEventSources.clear();
    }

    function autoUtLivePanel(item) {
      const live = state.autoUtLive[item.id];
      if (!live) return '';
      const current = live;
      const operations = Object.values(current.operations || {}).slice(-50).map(operation => `<div class="auto-ut-operation ${operation.error ? 'error' : operation.status === '完成' ? 'done' : ''}"><i></i><strong>${escapeHtml(operation.name || '执行步骤')}</strong><span>${escapeHtml(operation.status)}</span>${operation.command ? `<code title="${escapeHtml(operation.command)}">${escapeHtml(operation.command)}</code>` : ''}</div>`).join('');
      const tools = Object.values(current.tools).map(tool => `<div class="auto-ut-tool ${tool.error ? 'error' : ''}"><div class="auto-ut-tool-head"><strong>${escapeHtml(tool.name || '工具')}</strong><span>${escapeHtml(tool.status)}</span></div>${tool.args ? `<pre>${escapeHtml(tool.args)}</pre>` : ''}${tool.output ? `<pre class="auto-ut-stream-text" data-auto-ut-stream="${escapeHtml(item.id + '-tool-' + tool.id)}">${escapeHtml(tool.output)}</pre>` : ''}</div>`).join('');
      const hasPi = current.thinkingActive || current.thinking || current.message || Object.keys(current.tools).length;
      return `<section class="auto-ut-live" data-auto-ut-live="${escapeHtml(item.id)}"><div class="auto-ut-live-head"><strong>实时执行</strong><span>${escapeHtml(current.status)}</span></div>${operations ? `<div class="auto-ut-stream-block"><strong>流程进度</strong><div class="auto-ut-operation-list">${operations}</div></div>` : ''}${hasPi ? `<details class="auto-ut-thinking" data-auto-ut-thinking="${escapeHtml(item.id)}" ${current.thinkingOpen ? 'open' : ''}><summary>${current.thinkingActive ? 'Pi 正在思考…' : 'Pi 思考过程'}${current.thinking ? ` · ${current.thinking.length} 字符` : ''}</summary><pre class="auto-ut-stream-text" data-auto-ut-stream="${escapeHtml(item.id + '-thinking')}">${escapeHtml(current.thinking || '等待模型返回思考内容…')}</pre></details><div class="auto-ut-stream-block"><strong>Pi 回复</strong><pre class="auto-ut-stream-text" data-auto-ut-stream="${escapeHtml(item.id + '-message')}">${escapeHtml(current.message || '等待 Pi 回复…')}</pre></div>` : ''}${tools ? `<div class="auto-ut-stream-block"><strong>Pi 工具执行</strong><div class="auto-ut-tool-list">${tools}</div></div>` : ''}</section>`;
    }

    function autoUtRows(items, planned = false) {
      if (!items.length) return `<p style="color:var(--muted)">${planned ? '获取 UT 报告或导入 CSV 后显示执行计划。' : '暂无 Auto-UT 任务。'}</p>`;
      const visibleItems = planned ? items : items.filter((item, index) => items.findIndex(candidate => candidate.repository === item.repository && candidate.reportVersion === item.reportVersion) === index);
      return `<div class="auto-ut-list">${visibleItems.map(item => {
        if (planned) return `<div class="auto-ut-row"><div>${item.version?`<label><input type="checkbox" data-report-select="${escapeHtml(item.version+'/'+item.repository)}" ${reportUi.selected.has(item.version+'/'+item.repository)?'checked':''} ${item.configured?'':'disabled'}> <span class="badge brand">${escapeHtml(item.version)}</span></label>`:''}<strong>${escapeHtml(item.repository)}</strong><p>失败 ${item.failedTests} · 行覆盖率 ${Math.round(item.lineCoverage * 100)}%/${Math.round(item.lineGoal * 100)}%</p><p>${escapeHtml(item.repairBranch || '仓库未配置')}</p></div><div class="auto-ut-repository-editor"><input value="${escapeHtml(item.repositoryUrl || '')}" aria-label="${escapeHtml(item.repository)} CodeHub 仓库" data-auto-ut-repository-url="${escapeHtml(item.repository)}"><button type="button" class="button small" data-auto-ut-repository-save="${escapeHtml(item.repository)}">保存</button></div><span class="badge ${item.repositoryCustomized ? 'green' : item.configured ? 'brand' : 'red'}">${item.repositoryCustomized ? '已保存' : item.configured ? '默认仓库' : '未配置'}</span></div>`;
        const action = item.pullRequestUrl
          ? `<a class="button small" href="${escapeHtml(item.pullRequestUrl)}" target="_blank" rel="noopener noreferrer">打开 CodeHub MR ↗</a>`
          : item.status === 'WAITING_CONFIRMATION' || item.status === 'WAITING_EXTERNAL'
            ? `<button class="button small primary" data-auto-ut-continue="${escapeHtml(item.id)}">${item.status === 'WAITING_EXTERNAL' ? '重试' : '继续'}：${escapeHtml(autoUtStage[item.nextStage] || item.nextStage)}</button>`
            : `<code>${escapeHtml(item.repairBranch)}</code>`;
        return `<div class="auto-ut-row" data-auto-ut-task="${escapeHtml(item.id)}"><div>${item.reportVersion?`<span class="badge brand">${escapeHtml(item.reportVersion)}</span> `:''}<strong>${escapeHtml(item.repository)}</strong><p>${escapeHtml(item.message)}</p><p>📁 ${escapeHtml(item.workspaceRoot)} / ${item.reportVersion?escapeHtml(item.reportVersion)+' / ':''}${escapeHtml(item.repository)}</p><div class="auto-ut-progress" data-auto-ut-progress="${item.progress || 0}"><span style="width:${item.progress || 0}%"></span></div></div><div class="auto-ut-task-actions">${action}</div><span class="badge ${item.status === 'RESOLVED' ? 'green' : item.status === 'WAITING_EXTERNAL' || item.status === 'WAITING_REPOSITORY' || item.status === 'RETRY_PENDING' ? 'red' : 'brand'}">${autoUtStatus[item.status] || item.status} · ${item.progress || 0}%</span>${autoUtLivePanel(item)}</div>`;

    }

    function autoUtScheduleControl() {
      const saved = state.autoUtSchedule;
      const detail = saved ? `每天 ${escapeHtml(saved.dailyTime)} · ${escapeHtml(saved.baseBranch)} · ${escapeHtml(saved.reportFileName)}` : '按北京时间每天自动执行';

    function automationContent() {
      if (state.automationPage === 'quality') return qualityContent();
      if (state.automationPage === 'catalog') {
        return `${pageTitle('自动化工具', '集中运行可观测、可控制的自动化任务。')}<div class="capability-grid"><button class="panel capability-card" data-automation-capability="quality"><div class="capability-card-top"><div class="capability-symbol">QC</div><span class="status ok">可用</span></div><h2 style="margin-top:16px">质量检查</h2><p>按版本查询 UT、APITest 和静态检查报告。</p></button><button class="panel capability-card" data-automation-capability="auto-ut"><div class="capability-card-top"><div class="capability-symbol">UT</div><span class="status ok">可用</span></div><h2 style="margin-top:16px">Auto-UT</h2><p>扫描 UT 报告，按项目修复测试并在验证通过后创建 CodeHub MR。</p></button></div>`;

      return autoUtWorkspaceContent();

    async function autoUtCall(path, options = {}) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({message: '请求失败'}));
        throw new Error(body.message || '请求失败');
      }
      if (response.status === 204) return null;
      return response.json();
    }

    function autoUtForm(includeExecution = false) {
      const form = new FormData();
      form.append('report', state.autoUtReport);
      form.append('username', state.autoUtUsername);
      form.append('ticket', state.autoUtTicket);
      form.append('baseBranch', state.autoUtBaseBranch);
      if (includeExecution) {
        form.append('workspaceRoot', state.autoUtWorkspace);
        form.append('executionMode', state.autoUtMode);
      }
      return form;
    }

    function captureAutoUtInputs() {
      const username = document.querySelector('#auto-ut-username');
      const ticket = document.querySelector('#auto-ut-ticket');
      const baseBranch = document.querySelector('#auto-ut-base-branch');
      const dailyTime = document.querySelector('#auto-ut-daily-time');
      if (username) state.autoUtUsername = username.value.trim();
      if (ticket) state.autoUtTicket = ticket.value.trim();
      if (baseBranch) state.autoUtBaseBranch = baseBranch.value.trim();
      if (dailyTime) state.autoUtDailyTime = dailyTime.value;
    }

    async function scanAutoUt() {
      captureAutoUtInputs();
      if (!state.autoUtReport || !state.autoUtUsername || !state.autoUtTicket || !state.autoUtBaseBranch) return showToast('请选择 CSV 并填写用户名、单号和基础分支');
      state.autoUtBusy = true;
      render(false);
      try {
        state.autoUtPlan = await autoUtCall('/api/auto-ut/scan', { method: 'POST', body: autoUtForm() });
        showToast(state.autoUtPlan.length ? `发现 ${state.autoUtPlan.length} 个待修复仓库` : '报告中没有需要修复的仓库');
      } catch (error) {
        showToast(error.message || '报告扫描失败');
      } finally {
        state.autoUtBusy = false;
        render(false);
      }
    }

    async function startAutoUt() {
      if (!reportUi.csv) return startReportTasks();
      captureAutoUtInputs();
      if (!state.autoUtReport || !state.autoUtWorkspace || !state.autoUtBaseBranch) return showToast('请选择 CSV、基础分支和工作目录');
      state.autoUtBusy = true;
      render(false);
      try {
        await autoUtCall('/api/auto-ut/tasks', { method: 'POST', body: autoUtForm(true) });
        state.autoUtPlan = [];
        workspaceUi.autoTab='tasks';
        state.autoUtTasks = await autoUtCall('/api/auto-ut/tasks');
        showToast('Auto-UT 任务已创建');
        scheduleAutoUtPolling();
      } catch (error) {
        showToast(error.message || '任务创建失败');
      } finally {
        state.autoUtBusy = false;
        render(false);
      }
    }

    async function saveAutoUtRepository(repository) {
      const input = [...document.querySelectorAll('[data-auto-ut-repository-url]')]
        .find(item => item.dataset.autoUtRepositoryUrl === repository);
      const url = input?.value.trim();
      if (!url) return showToast('请输入 CodeHub 仓库地址');
      try {
        const saved = await autoUtCall(`/api/auto-ut/repositories/${encodeURIComponent(repository)}`, {
          method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})
        });
        for (const plan of state.autoUtPlan.filter(item => item.repository === repository)) {
          plan.repositoryUrl = saved.url;
          plan.repositoryCustomized = true;
          plan.configured = plan.version ? Boolean(plan.baseBranch) : true;
        }
        render(false);
        showToast(`${repository} 仓库映射已保存`);
      } catch (error) {
        showToast(error.message || '仓库映射保存失败');
      }
    }

    async function loadAutoUtTasks() {
      try {
        state.autoUtTasks = await autoUtCall('/api/auto-ut/tasks');
        render(false);
        scheduleAutoUtPolling();
      } catch (error) {
        showToast(error.message || '任务加载失败');
      }
    }

    async function browseAutoUtDirectories(path = '') {
      captureAutoUtInputs();
      try {
        const query = path ? `?path=${encodeURIComponent(path)}` : '';
        state.autoUtDirectory = await autoUtCall(`/api/auto-ut/workspace-directories${query}`);
        render(false);
      } catch (error) {
        showToast(error.message || '无法读取工作目录');
      }
    }

    function selectAutoUtWorkspace() {
      if (!state.autoUtDirectory?.current) return;
      state.autoUtWorkspace = state.autoUtDirectory.current;
      state.autoUtDirectory = null;
      render(false);
    }

    async function loadAutoUtSchedule() {
      try {
        const schedule = await autoUtCall('/api/auto-ut/schedule');
        state.autoUtSchedule = schedule;
        state.autoUtScheduleEnabled = Boolean(schedule);
        state.autoUtDailyTime = schedule?.dailyTime || '';
        render(false);
      } catch (error) {
        showToast(error.message || '定时配置加载失败');
      }
    }

    async function toggleAutoUtSchedule() {
      captureAutoUtInputs();
      if (state.autoUtSchedule && state.autoUtScheduleEnabled) {
        try {
          await autoUtCall('/api/auto-ut/schedule', { method: 'DELETE' });
          state.autoUtSchedule = null;
          state.autoUtScheduleEnabled = false;
          state.autoUtDailyTime = '';
          render(false);
          showToast('每日定时已关闭');
        } catch (error) {
          showToast(error.message || '无法关闭每日定时');
        }
        return;
      }
      state.autoUtScheduleEnabled = !state.autoUtScheduleEnabled;
      render(false);
    }

    async function saveAutoUtSchedule() {
      captureAutoUtInputs();
      if (!state.autoUtReport || !state.autoUtUsername || !state.autoUtTicket || !state.autoUtBaseBranch
          || !state.autoUtWorkspace || !state.autoUtDailyTime) {
        return showToast('请完整填写执行输入、CSV、工作目录和每日时间');
      }
      const form = autoUtForm();
      form.append('workspaceRoot', state.autoUtWorkspace);
      form.append('dailyTime', state.autoUtDailyTime);
      try {
        state.autoUtSchedule = await autoUtCall('/api/auto-ut/schedule', { method: 'PUT', body: form });
        state.autoUtScheduleEnabled = true;
        render(false);
        showToast(`已设置每天 ${state.autoUtDailyTime} 自动执行`);
      } catch (error) {
        showToast(error.message || '定时配置保存失败');
      }
    }

    async function continueAutoUt(id) {
      try {
        await autoUtCall(`/api/auto-ut/tasks/${encodeURIComponent(id)}/continuation`, { method: 'POST' });
        await loadAutoUtTasks();
      } catch (error) {
        showToast(error.message || '任务继续失败');
      }
    }

    function scheduleAutoUtPolling() {
      clearTimeout(autoUtPollTimer);
      if (state.platformDomain === 'automation' && state.automationPage === 'auto-ut'
          && state.autoUtTasks.some(task => autoUtActiveStatus.has(task.status))) {
        autoUtPollTimer = setTimeout(loadAutoUtTasks, 1200);

    function variantA() {

      const nav = `<div class="variant-a-nav"><button data-page="dashboard" class="${state.page === 'dashboard' ? 'active' : ''}">工作台</button><div class="nav-section">研发流程</div><button data-page="build" class="${state.page === 'build' ? 'active' : ''}">构建</button><button data-page="deploy" class="${state.page === 'deploy' ? 'active' : ''}">部署</button><div class="nav-section">容器运维</div><button data-page="operations" class="${state.page === 'operations' ? 'active' : ''}">服务资源</button><div class="nav-section">系统管理</div><button data-page="resources" class="${state.page === 'resources' ? 'active' : ''}">环境管理</button><div class="nav-section">任务</div><button>任务中心</button></div>`;
      const placeholders = {

          ? automationContent()

      return `<div class="variant-a-shell"><aside class="variant-a-sidebar"><div class="variant-a-brand">${taiji}<div><strong>运维平台</strong><span>统一基础设施工作台</span></div></div>${platformSwitch}${state.platformDomain === 'container' ? nav : ''}<div class="variant-a-user">林工 · 本地环境</div></aside><main class="variant-a-main">${content}</main></div>`;

    let toastTimer;
    let searchTimer;
    const testTokens = new Map();

    function showToast(copy) {
      let toast = document.querySelector('#global-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'global-toast';
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = copy;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.remove();
      }, 2400);
    }

    function copySshCommand(environment) {
      const command = `ssh ${environment.user}@${environment.ip} -p ${environment.port}`;
      const textarea = document.createElement('textarea');
      textarea.value = command;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
      showToast(`已复制：${command}`);
    }

    function finishConnectionTest(environment, token, batchMode = false) {
      if (testTokens.get(environment.id) !== token) return;
      testTokens.delete(environment.id);
      const success = environment.outcome === 'online';
      environment.status = success ? 'online' : 'error';
      environment.lastTest = '刚刚';
      environment.latency = success ? `${72 + environments.indexOf(environment) * 7} ms` : '连接超时';
      environment.history.unshift({ time: '刚刚', status: environment.status, copy: success ? `模拟 SSH 连接成功 · ${environment.latency}` : '模拟连接超时 · 10 秒' });
      if (batchMode && state.batch && state.batch.targetIds.includes(environment.id)) {
        state.batch.completed += 1;
        state.batch[success ? 'passed' : 'failed'] += 1;
        if (state.batch.completed === state.batch.total) {
          const summary = `模拟测试完成：${state.batch.passed} 个成功，${state.batch.failed} 个失败`;
          state.batch = null;
          render(false);
          showToast(summary);
          return;
        }
      }
      render(false);
      if (!batchMode) showToast(success ? `${environment.name} 可以连接` : `${environment.name} 连接失败`);
    }

    function testEnvironment(id) {
      const environment = environments.find(item => item.id === id);
      if (!environment || state.batch || testTokens.has(environment.id)) return;
      const token = Symbol(environment.id);
      testTokens.set(environment.id, token);
      render(false);
      setTimeout(() => finishConnectionTest(environment, token), 700);
    }

    function testAllEnvironments() {
      if (state.batch) return;
      const scoped = versionEnvironments(state.resourceType);
      const targets = scoped.filter(item => !testTokens.has(item.id));
      if (!targets.length) {
        showToast('当前范围没有可测试的环境');
        return;
      }
      state.batch = { version: state.resourceVersion, type: state.resourceType, targetIds: targets.map(item => item.id), total: targets.length, completed: 0, passed: 0, failed: 0 };
      state.resourceStatus = 'all';
      state.resourceQuery = '';
      targets.forEach(item => {
        testTokens.set(item.id, Symbol(item.id));
      });
      render(false);
      targets.forEach((item, index) => {
        const token = testTokens.get(item.id);
        setTimeout(() => finishConnectionTest(item, token, true), 650 + index * 260);
      });
    }

    function saveEnvironment() {
      const form = document.querySelector('#environment-form');
      if (!form || !form.reportValidity()) return;
      const values = Object.fromEntries(new FormData(form));
      const targetVersion = releaseVersions.find(item => item.id === values.version);
      if (!targetVersion || targetVersion.locked) {
        const versionSelect = form.elements.version;
        versionSelect.setCustomValidity('历史版本为只读，请选择可维护版本');
        versionSelect.reportValidity();
        return;
      }
      const existing = environments.find(item => item.id === form.dataset.environmentId);
      const type = form.dataset.environmentType;
      const record = existing || { id: `${type}-${Date.now()}`, type, user: type === 'build' ? 'huawei' : 'sopuser', sshPasswordConfigured: false, status: 'untested', lastTest: '尚未测试', latency: '—', outcome: 'online', history: [] };
      Object.assign(record, { name: values.name, version: values.version, ip: values.ip, port: values.port, workdir: values.workdir, architecture: values.architecture, mae: values.mae || '', maeUser: values.maeUser || '', osmu: values.osmu || '', osmuUser: values.osmuUser || '' });
      if (values.password) record.sshPasswordConfigured = true;
      if (type === 'container') {
        if (values.maePassword) record.maePasswordConfigured = true;
        if (values.osmuPassword) record.osmuPasswordConfigured = true;
      }
      if (!existing) environments.push(record);
      state.resourceVersion = values.version;
      state.resourceType = type;
      state.resourceStatus = 'all';
      state.resourceQuery = '';
      state.resourceDrawer = null;
      render(false);
      showToast(existing ? '环境配置已保存' : '环境已新增');
    }

    function bindResourceInteractions() {
      document.querySelector('#release-version')?.addEventListener('change', event => { state.resourceVersion = event.target.value; state.resourceStatus = 'all'; state.resourceQuery = ''; render(); });
      document.querySelectorAll('[data-resource-type]').forEach(item => item.addEventListener('click', () => { state.resourceType = item.dataset.resourceType; state.resourceStatus = 'all'; state.resourceQuery = ''; render(); }));
      document.querySelector('#environment-search')?.addEventListener('input', event => {
        state.resourceQuery = event.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          render(false);

ries(qwNames).map(([k,n])=>`<button class="qw-tab ${qualityUi.kind===k?'active':''}" data-qw-tab="${k}" aria-pressed="${qualityUi.kind===k}">${n}<span class="qw-count">${count(k)}</span></button>`).join('')}</nav><div class="qw-toolbar"><input class="qw-search" id="q-search" placeholder="搜索代码仓或团队" value="${escapeHtml(qualityUi.search)}" aria-label="搜索报告"><select id="q-version" aria-label="筛选版本"><option value="">全部版本</option>${(job?.input.versions||[]).map(v=>`<option ${qualityUi.version===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select><select data-qw-issue aria-label="筛选问题"><option value="">全部问题</option>${(qualityUi.kind==='ut'?['失败用例','覆盖率不足']:qualityUi.kind==='api'?['失败用例','执行异常','未达标']:[]).map(v=>`<option ${workspaceUi.issue===v?'selected':''}>${v}</option>`).join('')}</select><span class="qw-spacer"></span><button class="button" data-qw-drawer="export" ${job?'':'disabled'}>↓ &nbsp; 导出 CSV</button></div><div class="qw-notice">${qualityUi.kind==='static'?'按团队展示各工具的问题数量；报告日期不参与静态检查筛选。':'仅展示异常记录；没有有效数据与检查全部通过会分别标识。'}</div>${qwQualityTable()}</section>${qwDrawer()}</div>`;
    }
    function qwMetric(value,goal){const n=Number(value),g=Number(goal);if(value===null||value===undefined||!Number.isFinite(n))return '—';return `<span class="${Number.isFinite(g)&&n<g?'qw-cell-bad':''}"><span class="qw-meter"><i style="width:${Math.min(100,Math.max(0,n*100))}%"></i></span>${(n*100).toFixed(1)}%${Number.isFinite(g)?` <span class="qw-muted">/ ${(g*100).toFixed(0)}%</span>`:''}</span>`;}
    function qwQualityEntries(){return (qualityUi.job?.parts||[]).flatMap((part,pi)=>part.kind!==qualityUi.kind||qualityUi.version&&part.version!==qualityUi.version?[]:part.rows.map((row,ri)=>({part,row,pi,ri}))).filter(({row})=>{
      if(!Object.values(row).join(' ').toLowerCase().includes(qualityUi.search.toLowerCase()))return false;
      if(workspaceUi.issue==='失败用例')return Number(row[qualityUi.kind==='ut'?'失败用例':'失败用例数'])>0;
      if(workspaceUi.issue==='覆盖率不足')return Number(row['行覆盖率'])<Math.min(Number(row['行覆盖率目标']),.8)||row['语言']!=='Cpp'&&Number(row['分支覆盖率'])<Math.min(Number(row['分支覆盖率目标']),.7);
      if(workspaceUi.issue==='执行异常')return Number(row['状态'])!==0;
      if(workspaceUi.issue==='未达标')return Number(row['是否达标'])!==0;
      return true;
    });}
    function qwPagination(kind,total){const key=kind==='quality'?'qualityPage':'planPage',pages=Math.max(1,Math.ceil(total/20));workspaceUi[key]=Math.max(1,Math.min(workspaceUi[key],pages));return `<footer class="qw-table-foot"><span>共 ${total} 条 · 每页 20 条</span><div class="qw-page-controls"><button class="button small" data-qw-pager="${kind}" data-step="-1" ${workspaceUi[key]===1?'disabled':''}>‹</button><span>${workspaceUi[key]} / ${pages}</span><button class="button small" data-qw-pager="${kind}" data-step="1" ${workspaceUi[key]===pages?'disabled':''}>›</button></div></footer>`;}
    function qwQualityTable(){
      const entries=qwQualityEntries(),footer=qwPagination('quality',entries.length),page=entries.slice((workspaceUi.qualityPage-1)*20,workspaceUi.qualityPage*20),kind=qualityUi.kind;
      const cols=kind==='ut'?['代码仓 / 团队','版本','失败用例','行覆盖率 / 达标线','分支覆盖率 / 达标线','操作']:kind==='api'?['代码仓 / 团队','版本','失败用例','执行状态','接口达标','操作']:['PL 团队','版本','问题总数','非零检查项','操作'];
      const rows=page.map(({part:p,row:r,pi,ri})=>`<tr>${kind==='static'?`<td class="qw-repo">${escapeHtml(r['组名'])}</td><td><span class="badge">${p.version}</span></td><td class="qw-cell-bad">${Object.entries(r).filter(([k])=>k!=='组名').reduce((n,[,v])=>n+(Number(v)||0),0)}</td><td>${Object.entries(r).filter(([k,v])=>k!=='组名'&&Number(v)>0).slice(0,3).map(([k,v])=>`<span class="badge amber">${escapeHtml(k)} ${escapeHtml(v)}</span>`).join(' ')}${Object.entries(r).filter(([k,v])=>k!=='组名'&&Number(v)>0).length>3?' …':''}</td>`:`<td><span class="qw-repo">${escapeHtml(r['代码仓'])}</span><span class="qw-sub">${escapeHtml(r['PL组'])} · ${escapeHtml(r['语言'])}</span></td><td><span class="badge">${p.version}</span></td><td class="${Number(r[kind==='ut'?'失败用例':'失败用例数'])>0?'qw-cell-bad':''}">${escapeHtml(r[kind==='ut'?'失败用例':'失败用例数'])}</td>${kind==='ut'?`<td>${qwMetric(r['行覆盖率'],Math.min(Number(r['行覆盖率目标']),.8))}</td><td>${r['语言']==='Cpp'?'不适用':qwMetric(r['分支覆盖率'],Math.min(Number(r['分支覆盖率目标']),.7))}</td>`:`<td><span class="badge ${Number(r['状态'])===0?'green':'red'}">${['成功','失败','其他'][Number(r['状态'])]||'未知'}</span></td><td><span class="badge ${Number(r['是否达标'])===0?'green':'amber'}">${Number(r['是否达标'])===0?'达标':'未达标'}</span></td>`}`}<td><button class="qw-link" data-qw-detail="${pi}/${ri}">查看详情</button></td></tr>`).join('');
      const parts=(qualityUi.job?.parts||[]).filter(p=>p.kind===kind&&(!qualityUi.version||p.version===qualityUi.version));
      const notices=parts.filter(p=>p.status!=='SUCCEEDED').map(p=>`<div class="qw-notice">${p.version} · ${escapeHtml(p.message)}</div>`).join('');
      return `${notices}<div class="qw-table-wrap">${rows?`<table class="qw-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`:qwEmpty(!qualityUi.job?'开始一次质量检查':parts.some(p=>p.status==='RUNNING'||p.status==='QUEUED')?'正在获取报告':parts.length&&parts.every(p=>p.status==='SUCCEEDED')&&!qualityUi.search&&!workspaceUi.issue?'未发现异常':'暂无匹配记录',!qualityUi.job?'选择版本与团队，点击“开始检查”。':'请查看执行状态，或调整版本与问题筛选。')}</div>${footer}`;
    }
    function reportPanel(){const c=reportUi.config,s=c.schedule;return `<section class="panel qw-query"><div class="qw-title"><h2><span class="qw-step-number">1</span>获取 UT 报告</h2><div class="qw-source"><button class="${!reportUi.csv?'active':''}" data-report-source="fetch">在线获取</button><button class="${reportUi.csv?'active':''}" data-report-source="csv">导入 CSV</button></div></div>${reportUi.csv?`<label class="auto-ut-file"><span class="qw-muted">选择 Grafana UT CSV</span><input id="auto-ut-report" type="file" accept=".csv,text/csv"><small id="auto-ut-file-name" class="qw-muted">${escapeHtml(state.autoUtReport?.name||'尚未选择文件')}</small></label><div class="qw-query-foot"><span class="qw-muted">基础分支：${escapeHtml(state.autoUtBaseBranch||'请在执行设置中填写')}</span><button class="button primary" data-auto-ut-scan ${state.autoUtBusy?'disabled':''}>扫描报告</button></div>`:`<div class="qw-version-cards">${c.versions.map(v=>`<div class="qw-version-chip"><b>${escapeHtml(v.version||'待配置版本')}</b><span class="qw-sub">${escapeHtml(v.baseBranch||'未配置基础分支')}</span></div>`).join('')}<button class="button ghost" data-qw-drawer="versions">管理版本 / 分支</button></div><div class="qw-query-foot"><div class="head-actions"><label class="qw-muted" for="qw-report-date">报告日期</label><select id="qw-report-date" data-report-key="dateMode"><option value="yesterday" ${c.dateMode==='yesterday'?'selected':''}>执行前一天</option><option value="today" ${c.dateMode==='today'?'selected':''}>执行当天</option></select><span class="qw-muted">Java · 智能驾舱组</span></div><button class="button primary" data-report-fetch ${reportUi.busy||reportUi.run?.status==='FETCHING'?'disabled':''}>${reportUi.busy||reportUi.run?.status==='FETCHING'?'正在获取…':'获取 UT 报告'}</button></div>`}<div class="qw-query-foot"><div class="qw-schedule-strip"><span>◷</span><strong>定时执行</strong><span>${s.enabled?`${{daily:'每天',weekdays:'工作日',weekly:'每周'}[s.frequency]} ${escapeHtml(s.time)} · ${s.action==='REPAIR'?'获取并自动修复':'仅获取报告'}`:'未启用'}</span>${state.autoUtSchedule?'<span class="badge amber">另有 CSV 定时计划，可在执行设置中管理</span>':''}${reportUi.nextRunAt?`<span>· 下次 ${escapeHtml(new Date(reportUi.nextRunAt).toLocaleString('zh-CN',{timeZone:s.timezone}))}</span>`:''}</div><button class="qw-link" data-qw-drawer="schedule">${s.enabled?'管理计划':'设置计划'} →</button></div></section>`;}
    function autoUtWorkspaceContent(){const run=reportUi.run,active=state.autoUtTasks.filter(t=>autoUtActiveStatus.has(t.status)).length;return `<div class="quality-workspace">${qwHeader('Auto-UT','获取报告，按版本修复测试并跟踪执行进度。','<button class="button" data-qw-drawer="history">◷ &nbsp; 历史记录</button><button class="button" data-qw-drawer="execution">⚙ &nbsp; 执行设置</button><button class="button" data-qw-drawer="connection">连接设置</button>')}${reportPanel()}${run?`<section class="panel qw-progress"><i class="qw-dot ${['FAILED','PARTIAL','INTERRUPTED'].includes(run.status)?'error':''}"></i><div class="qw-progress-copy"><strong>${qwStatuses[run.status]||run.status}</strong><span class="qw-muted"> &nbsp; ${run.config.versions.length} 个版本 · ${qwDate(run.createdAt)}</span></div><button class="qw-link" data-qw-drawer="logs">查看获取记录 →</button></section>`:''}<div class="qw-stats">${qwStat('待修复仓库 / 版本',state.autoUtPlan.length,'同一仓库按不同版本分别统计','UT')}${qwStat('已选择',reportUi.csv?state.autoUtPlan.length:reportUi.selected.size,'勾选后使用报告快照创建任务','✓')}${qwStat('正在执行',active,'拉取 · 基线 · 修复 · 验证 · MR','⟳')}</div><section class="panel"><nav class="qw-tabs"><button class="qw-tab ${workspaceUi.autoTab==='plan'?'active':''}" data-qw-auto-tab="plan">执行计划<span class="qw-count">${state.autoUtPlan.length}</span></button><button class="qw-tab ${workspaceUi.autoTab==='tasks'?'active':''}" data-qw-auto-tab="tasks">任务进度<span class="qw-count">${state.autoUtTasks.length}</span></button></nav>${workspaceUi.autoTab==='plan'?`<div class="qw-toolbar"><input id="qw-plan-search" class="qw-search" placeholder="搜索代码仓" value="${escapeHtml(workspaceUi.planSearch)}"><select id="qw-plan-version" aria-label="筛选计划版本"><option value="">全部版本</option>${[...new Set(state.autoUtPlan.map(p=>p.version).filter(Boolean))].map(v=>`<option ${workspaceUi.planVersion===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select><span class="qw-spacer"></span>${autoUtModeControl()}<button class="button primary" data-auto-ut-start ${state.autoUtBusy||qwPlanBlockReason()||(!reportUi.csv&&!reportUi.selected.size)||!state.autoUtPlan.some(i=>i.configured)?'disabled':''}>开始修复${reportUi.csv?'':`（${reportUi.selected.size}）`}</button></div><div class="qw-notice">${qwPlanBlockReason()?escapeHtml(qwPlanBlockReason())+' ':''}${state.autoUtWorkspace?`工作目录：${escapeHtml(state.autoUtWorkspace)} · `:''}每个版本使用独立目录与分支。执行采用获取报告时保存的配置。 <button class="qw-link" data-qw-drawer="execution">执行设置</button></div>${qwPlanTable()}`:`<div class="qw-toolbar"><strong>项目执行进度</strong><select id="qw-task-version" aria-label="筛选任务版本"><option value="">全部版本</option>${[...new Set(state.autoUtTasks.map(t=>t.reportVersion||'CSV'))].map(v=>`<option ${workspaceUi.taskVersion===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}</select><span class="qw-spacer"></span><button class="button small" data-auto-ut-refresh>刷新</button></div><div class="qw-tasks">${autoUtRows(state.autoUtTasks)}</div>`}</section>${run?`<details class="panel qw-run-log" data-qw-open="report-log"><summary><span>⌘ &nbsp; 获取日志与跳过原因</span><span>展开 ⌄</span></summary><div class="qw-log-lines">${run.messages.map(escapeHtml).join('\n')||'正在获取报告…'}</div></details>`:''}${qwDrawer()}${autoUtDirectoryDialog()}</div>`;}
    function qwPlanBlockReason(){
      if(!state.autoUtPlan.length)return '';

    function qwPlanTable(){const all=qwPlanEntries(),foot=qwPagination('plan',all.length),items=all.slice((workspaceUi.planPage-1)*20,workspaceUi.planPage*20),selected=items.filter(qwSelectable),allSelected=selected.length&&selected.every(p=>reportUi.selected.has(p.version+'/'+p.repository));return `<div class="qw-table-wrap">${items.length?`<table class="qw-table"><thead><tr><th>${reportUi.csv?'':`<input type="checkbox" data-qw-select-all aria-label="全选本页可执行仓库" ${allSelected?'checked':''}>`}</th><th>代码仓</th><th>版本 / 基础分支</th><th>失败用例</th><th>行覆盖率 / 目标</th><th>分支覆盖率 / 目标</th><th>仓库配置</th></tr></thead><tbody>${items.map(p=>`<tr><td>${reportUi.csv?'':`<input type="checkbox" aria-label="选择 ${escapeHtml(p.version+' '+p.repository)}" data-report-select="${escapeHtml(p.version+'/'+p.repository)}" ${reportUi.selected.has(p.version+'/'+p.repository)?'checked':''} ${qwSelectable(p)?'':'disabled'}>`}</td><td class="qw-repo">${escapeHtml(p.repository)}<span class="qw-sub">${reportUi.run?.claimed.includes(p.version+'/'+p.repository)?'已处理，无需重复执行':!p.configured?'需配置分支并重新获取':'Java · 智能驾舱组'}</span></td><td><span class="badge">${escapeHtml(p.version||'CSV')}</span><span class="qw-sub">${escapeHtml(p.baseBranch||state.autoUtBaseBranch||'未配置分支')}</span></td><td class="${p.failedTests>0?'qw-cell-bad':''}">${p.failedTests}</td><td>${qwMetric(p.lineCoverage,p.lineGoal)}</td><td>${qwMetric(p.branchCoverage,p.branchGoal)}</td><td><button class="qw-link" data-qw-repository="${escapeHtml(p.repository)}">${p.repositoryCustomized?'已保存 · 修改':'默认仓库 · 修改'}</button></td></tr>`).join('')}</tbody></table>`:qwEmpty(state.autoUtPlan.length?'没有匹配的仓库':'等待获取 UT 报告',state.autoUtPlan.length?'调整版本筛选或搜索条件。':'先获取报告，再选择需要修复的仓库与版本。')}</div>${foot}`;}
    function qualityConnectionPanel(){const c=qualityUi.connection;return `<div class="qw-tip">质量检查与 Auto-UT 共用此连接配置。</div><label class="qw-field"><span>Grafana 查询接口</span><input data-q-connection="url" value="${escapeHtml(c.url)}" required type="url"></label><div class="qw-two">${[['datasourceId','数据源 ID',1,999999],['timeoutSeconds','查询超时（秒）',5,180],['parallel','并发查询数',1,4]].map(([k,n,min,max])=>`<label class="qw-field"><span>${n}</span><input type="number" min="${min}" max="${max}" required data-q-connection="${k}" value="${c[k]}"></label>`).join('')}<label class="qw-field"><span>认证方式</span><select data-q-connection="auth"><option value="none" ${c.auth==='none'?'selected':''}>无认证</option><option value="token" ${c.auth==='token'?'selected':''}>后端 Token</option></select></label></div><p class="qw-muted">使用 Token 时，在后端配置 QUALITY_GRAFANA_TOKEN；页面不保存或回显凭据。</p>`;}
