<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运维平台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --ink: #202b33;
      --muted: #66737d;
      --faint: #8e99a2;
      --line: #e1e6e9;
      --brand: #3563e9;
      --brand-soft: #edf2ff;
      --green: #16836e;
      --green-soft: #e9f5f2;
      --violet: #5267c7;
      --violet-soft: #eef1fb;
      --amber: #a96f16;
      --amber-soft: #fff4df;
      --red: #c64c4c;
      --red-soft: #fff0ef;
      --shadow: 0 1px 2px rgba(25, 39, 48, .04);
      --font: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--bg); font: 14px/1.55 var(--font); font-weight: 400; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    strong, b { font-weight: 600; }
    h1 { font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -.02em; }
    h2 { font-size: 16px; line-height: 1.35; font-weight: 600; }
    h3 { font-size: 14px; font-weight: 600; }
    .mono { font-family: var(--mono); }
    .taiji { width: 30px; height: 30px; flex: 0 0 auto; }
    .taiji svg { display: block; width: 100%; height: 100%; }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .status.ok { color: var(--green); }
    .status.ok::before { background: var(--green); }
    .status.warn { color: var(--amber); }
    .status.warn::before { background: var(--amber); }
    .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 99px; color: var(--muted); background: #eef1f3; font-size: 12px; font-weight: 500; }
    .badge.brand { color: var(--brand); background: var(--brand-soft); }
    .badge.green { color: var(--green); background: var(--green-soft); }
    .badge.violet { color: var(--violet); background: var(--violet-soft); }
    .badge.amber { color: var(--amber); background: var(--amber-soft); }
    .badge.red { color: var(--red); background: var(--red-soft); }
    .button { border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; color: var(--ink); background: var(--surface); font-weight: 500; }
    .button:hover { border-color: #b9c3c9; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .button.primary { color: white; border-color: var(--brand); background: var(--brand); }
    .button.ghost { color: var(--muted); background: transparent; }
    .button.small { padding: 6px 9px; font-size: 12px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 49px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel-body { padding: 16px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    .page-head p { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .head-actions { display: flex; align-items: center; gap: 8px; }
    .metric-value { font-size: 26px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; }
    .metric-label { color: var(--muted); font-size: 12px; }
    .metric-foot { margin-top: 3px; color: var(--faint); font-size: 12px; }
    .attention-list, .activity-list { display: grid; }
    .attention-row, .activity-row { display: grid; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .attention-row:last-child, .activity-row:last-child { border-bottom: 0; }
    .attention-row { grid-template-columns: auto minmax(0,1fr) auto; }
    .attention-row strong, .activity-row strong { display: block; font-size: 14px; font-weight: 500; }
    .attention-row p, .activity-row p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .activity-row { grid-template-columns: 58px minmax(0,1fr) auto; }
    .activity-time { color: var(--faint); font: 12px var(--mono); }
    .workspace-tabs { display: flex; align-items: center; gap: 4px; margin-bottom: 18px; }
    .workspace-tabs button { border: 0; border-radius: 8px; padding: 8px 12px; color: var(--muted); background: transparent; font-weight: 500; }
    .workspace-tabs button.active { color: var(--brand); background: var(--brand-soft); }
    .environment-bar { display: grid; grid-template-columns: minmax(220px,1.2fr) repeat(4,minmax(100px,.7fr)) auto; gap: 16px; align-items: center; margin-bottom: 16px; padding: 15px 17px; border-radius: 10px; color: white; background: #253744; }
    .environment-bar strong { display: block; }
    .environment-bar small { display: block; margin-top: 3px; color: #b9c4cb; font-size: 12px; }
    .environment-bar select { width: 100%; border: 1px solid #50616c; border-radius: 7px; padding: 8px 9px; color: white; background: #314550; font-weight: 500; }
    .environment-item span { display: block; color: #9baab3; font-size: 12px; }
    .environment-item b { display: block; margin-top: 3px; font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 500; }
    .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--ink); background: var(--surface-soft); }
    .repo-list { display: grid; gap: 9px; margin-top: 15px; }
    .repo-row { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px; border-radius: 9px; background: var(--surface-soft); }
    .repo-row span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .repo-row-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
    .repo-row-title span { margin-bottom: 0; }
    .repo-row > * { min-width: 0; }
    .repo-row input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; background: white; }
    .build-layout { display: grid; grid-template-columns: 390px minmax(0,1fr); gap: 16px; align-items: start; }
    .summary-stack { display: grid; gap: 14px; }
    .progress { height: 7px; overflow: hidden; border-radius: 99px; background: #e8ecef; }
    .progress span { display: block; width: 62%; height: 100%; background: var(--brand); }
    .terminal { min-height: 210px; padding: 15px; border-radius: 9px; color: #c2ccd2; background: #1d2b34; font: 12px/1.75 var(--mono); }
    .terminal b { color: #7ed2c3; }
    .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .resource-card { padding: 19px; }
    .resource-card-top { display: flex; justify-content: space-between; gap: 12px; }
    .resource-card p { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .connection-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin-top: 16px; }
    .connection { padding: 11px; border-radius: 8px; background: var(--surface-soft); }
    .connection span { color: var(--muted); font-size: 12px; }
    .connection strong { display: block; margin-top: 4px; font-size: 12px; }
    .empty { min-height: 420px; display: grid; place-items: center; text-align: center; }
    .empty-symbol { width: 54px; height: 54px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 16px; color: var(--violet); background: var(--violet-soft); font-size: 24px; }
    .empty p { max-width: 470px; margin-top: 7px; color: var(--muted); }
    .variant-a-shell { min-height: 100vh; }
    .variant-a-sidebar { position: fixed; inset: 0 auto 0 0; width: 208px; display: flex; flex-direction: column; padding: 18px 12px 14px; background: #f1f4f6; border-right: 1px solid var(--line); }
    .variant-a-brand { display: flex; align-items: center; gap: 9px; padding: 0 6px 16px; }
    .variant-a-brand strong { display: block; white-space: nowrap; color: #263740; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
    .variant-a-brand span { display: block; margin-top: 1px; color: #7b8891; font-size: 12px; font-weight: 400; }
    .platform-switch { display: grid; gap: 3px; margin: 0 0 14px; padding: 5px; border: 1px solid #dde3e7; border-radius: 11px; background: #e9edef; }
    .platform-switch-title { padding: 3px 7px 5px; color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .platform-symbol { width: 26px; height: 26px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 7px; color: #60717c; background: rgba(255,255,255,.58); font-size: 12px; font-weight: 700; }
    .platform-option { width: 100%; display: grid; grid-template-columns: 26px minmax(0,1fr) auto; align-items: center; gap: 9px; border: 0; border-radius: 8px; padding: 7px 8px; color: #5d6b74; background: transparent; text-align: left; transition: color .15s ease,background .15s ease,box-shadow .15s ease; }
    .platform-option:hover { color: var(--ink); background: rgba(255,255,255,.66); }
    .platform-option.active { color: var(--brand); background: white; box-shadow: 0 1px 4px rgba(25,39,48,.1); font-weight: 600; }
    .platform-option.active .platform-symbol { color: white; background: var(--brand); }
    .platform-option small { color: var(--faint); font-size: 10px; font-weight: 400; }
    .variant-a-nav { display: grid; gap: 2px; }
    .variant-a-nav .nav-section { margin: 14px 9px 4px; color: var(--faint); font-size: 12px; font-weight: 500; }
    .variant-a-nav button { width: 100%; border: 0; border-radius: 7px; padding: 8px 10px; color: #53616b; background: transparent; text-align: left; font-size: 14px; font-weight: 400; }
    .variant-a-nav button.active { color: var(--ink); background: white; box-shadow: inset 2px 0 var(--brand); font-weight: 600; }
    .variant-a-user { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .variant-a-main { min-height: 100vh; margin-left: 208px; padding: 24px; }
    .variant-a-status-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 16px; }
    .variant-a-status-item { min-width: 0; padding: 17px 18px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); box-shadow: 0 1px 2px rgba(25,39,48,.03); transition: border-color .15s ease,transform .15s ease; }
    .variant-a-status-item:hover { border-color: #c7d0d5; transform: translateY(-1px); }
    .variant-a-status-top { display: flex; align-items: baseline; gap: 9px; }
    .variant-a-columns { display: grid; grid-template-columns: minmax(0,7fr) minmax(320px,5fr); gap: 16px; }
    .variant-a-overview { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; margin-top: 16px; }
    .platform-placeholder { min-height: calc(100vh - 48px); display: grid; place-items: center; text-align: center; }
    .platform-placeholder-content { max-width: 430px; padding: 48px; }
    .platform-placeholder-symbol { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 18px; color: var(--brand); background: var(--brand-soft); font-size: 22px; font-weight: 600; }
    .platform-placeholder h1 { font-size: 24px; }
    .platform-placeholder p { margin-top: 8px; color: var(--muted); }
    .platform-boundary { display: inline-flex; margin-top: 18px; padding: 5px 9px; border-radius: 99px; color: var(--muted); background: #eef1f3; font-size: 12px; }
    .capability-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(280px,360px)); gap: 16px; }
    .capability-card { min-height: 150px; padding: 20px; text-align: left; }
    .capability-card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .capability-symbol { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: var(--brand); background: var(--brand-soft); font-weight: 700; }
    .capability-card p { margin-top: 16px; color: var(--muted); font-size: 13px; }
    .auto-ut-layout { display: grid; grid-template-columns: minmax(320px,.8fr) minmax(0,1.4fr); gap: 16px; align-items: start; }
    .auto-ut-file { display: grid; gap: 7px; margin-top: 14px; }
    .auto-ut-file input { width: 100%; border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: var(--surface-soft); }
    .auto-ut-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .auto-ut-list { display: grid; gap: 8px; }
    .auto-ut-row { display: grid; grid-template-columns: minmax(130px,1fr) minmax(190px,1.3fr) 110px; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
    .auto-ut-row:last-child { border-bottom: 0; }
    .auto-ut-row p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .auto-ut-row code { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-repository-editor { min-width: 0; display: flex; align-items: center; gap: 7px; }
    .auto-ut-repository-editor input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 9px; color: var(--ink); background: white; font: 11px/1.4 "Cascadia Code",Consolas,monospace; }
    .auto-ut-workspace { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); text-align: left; }
    .auto-ut-workspace span:last-child { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-schedule-line { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .auto-ut-schedule-copy { min-width: 0; margin-right: auto; }
    .auto-ut-schedule-copy strong, .auto-ut-schedule-copy small { display: block; }
    .auto-ut-schedule-copy small { margin-top: 2px; color: var(--muted); }
    .auto-ut-schedule-line input[type="time"] { width: 104px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; background: white; }
    .auto-ut-directory-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 24px; background: rgba(18,30,38,.34); }
    .auto-ut-directory-dialog { width: min(620px,100%); max-height: min(640px,80vh); display: flex; flex-direction: column; border-radius: 12px; background: white; box-shadow: 0 24px 70px rgba(18,30,38,.24); }
    .auto-ut-directory-head, .auto-ut-directory-footer { display: flex; align-items: center; gap: 9px; padding: 14px 16px; }
    .auto-ut-directory-head { border-bottom: 1px solid var(--line); }
    .auto-ut-directory-head>div{min-width:0;display:grid;gap:2px;margin-right:auto}.auto-ut-directory-head small{color:var(--muted)}.auto-ut-directory-head strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .auto-ut-directory-path{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#f8fafc}.auto-ut-directory-path input{min-width:0;flex:1}.auto-ut-directory-error{margin:10px 16px 0;padding:9px 11px;border-radius:6px;background:#fff2f0;color:#b54c3e}.auto-ut-directory-list { min-height: 220px; overflow: auto; padding: 8px; }
    .auto-ut-directory-entry { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 7px; padding: 10px; background: transparent; text-align: left; cursor: pointer; }
    .auto-ut-directory-entry:hover,.auto-ut-directory-entry:focus-visible { background: var(--surface-soft); }.auto-ut-directory-entry small{margin-left:auto;color:var(--brand);opacity:0}.auto-ut-directory-entry:hover small,.auto-ut-directory-entry:focus-visible small{opacity:1}.auto-ut-directory-empty{padding:28px 16px;text-align:center;color:var(--muted)}.directory-writable,.directory-readonly{margin-right:auto;font-size:12px}.directory-writable{color:#43835a}.directory-readonly{color:var(--muted)}
    .auto-ut-directory-footer { justify-content: flex-end; border-top: 1px solid var(--line); }
    .auto-ut-progress { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 999px; background: var(--surface-soft); }
    .auto-ut-progress span { display: block; height: 100%; border-radius: inherit; background: var(--brand); transition: width .25s ease; }
    .auto-ut-task-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .auto-ut-cleanup-control { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 14px 0 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-soft); }
    .auto-ut-cleanup-control > div { display: grid; gap: 3px; }
    .auto-ut-cleanup-control span { color: var(--muted); font-size: 12px; }
    .auto-ut-live { grid-column: 1 / -1; min-width: 0; display: grid; gap: 8px; margin-top: 4px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); }
    .auto-ut-live-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .auto-ut-live-head span { color: var(--muted); font-size: 12px; }
    .auto-ut-conversation { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .auto-ut-conversation-part { display: block; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
    .auto-ut-conversation-part:last-child { border-bottom: 0; }
    .auto-ut-conversation-part summary,.auto-ut-conversation-part > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; color: var(--muted); cursor: pointer; user-select: none; list-style: none; }
    .auto-ut-conversation-part summary::-webkit-details-marker { display: none; }
    .auto-ut-conversation-part summary small,.auto-ut-conversation-part > header small { color: var(--faint); font-size: 10px; }
    .auto-ut-prompt summary { color: var(--brand); font-weight: 600; }
    .auto-ut-reply > header { cursor: default; }
    .auto-ut-stream-block { min-width: 0; }
    .auto-ut-stream-block > strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .auto-ut-stream-text { max-height: 260px; overflow: auto; margin: 0; padding: 10px 11px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 7px; font: 12px/1.65 "Cascadia Code",Consolas,"Microsoft YaHei UI",monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-ut-conversation .auto-ut-stream-text { max-height: 320px; border: 0; border-top: 1px solid #eef1f5; border-radius: 0; background: #fbfcfe; }
    .auto-ut-tool-list { display: grid; gap: 6px; }
    .auto-ut-tool { border-bottom: 1px solid var(--line); background: transparent; }
    .auto-ut-tool:last-child { border-bottom: 0; }
    .auto-ut-tool-head { display: flex; align-items: center; gap: 8px; padding: 9px 4px; cursor: pointer; list-style: none; }
    .auto-ut-tool-head::-webkit-details-marker { display: none; }
    .auto-ut-tool-head strong { font-size: 12px; }
    .auto-ut-tool-head span { margin-left: auto; color: var(--muted); font-size: 11px; }
    .auto-ut-tool.error .auto-ut-tool-head span { color: var(--red); }
    .auto-ut-tool-body { padding: 0 4px 10px 20px; }
    .auto-ut-tool-body small { color: var(--faint); font-size: 10px; }
    .auto-ut-tool pre { max-height: 220px; overflow: auto; margin: 5px 0 9px; color: var(--muted); font: 11px/1.55 "Cascadia Code",Consolas,monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .auto-ut-operation-list { display: grid; gap: 5px; }
    .auto-ut-operation { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 7px; background: white; font-size: 12px; }
    .auto-ut-operation i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px rgba(25,114,120,.12); }
    .auto-ut-operation.done i { background: var(--green); box-shadow: none; }
    .auto-ut-operation.error i { background: var(--red); box-shadow: none; }
    .auto-ut-operation span { color: var(--muted); font-size: 11px; }
    .auto-ut-operation code { grid-column: 2 / -1; font-size: 10px; }
    .overview-card { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 16px; }
    .overview-card p { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .overview-card-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
    .task-table { margin-top: 16px; }
    .task-row { display: grid; grid-template-columns: minmax(220px,1.4fr) minmax(180px,1fr) minmax(160px,.8fr) 100px 70px; gap: 16px; align-items: center; min-height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); }
    .task-row:last-child { border-bottom: 0; }
    .task-row.head { min-height: 36px; color: var(--faint); background: var(--surface-soft); font-size: 12px; }
    .task-row strong { font-weight: 500; }
    .task-row span { color: var(--muted); font-size: 12px; }
    .resource-workspace { display: grid; gap: 16px; }
    .environment-summary { display: grid; grid-template-columns: minmax(300px,1.35fr) repeat(3,minmax(150px,.65fr)); gap: 12px; }
    .environment-version-card, .environment-summary-stat { min-height: 104px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); box-shadow: 0 1px 2px rgba(25,39,48,.03); }
    .environment-version-card { display: flex; align-items: center; justify-content: space-between; gap: 18px; background: linear-gradient(135deg,#243744,#314b58); color: white; }
    .environment-version-card label { color: #d8e2e7; font-size: 13px; font-weight: 600; }
    .environment-version-card select { min-width: 180px; border: 1px solid #61737d; border-radius: 8px; padding: 9px 10px; color: white; background: #39515d; font-weight: 600; }

    const tasks = [];

    const statusPresentation = {

      error: { label: '连接失败', className: 'error' },

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function selectedEnvironment(type) {
      const key = type === 'build' ? 'selectedBuildEnvironment' : 'selectedContainerEnvironment';
      return environments.find(item => item.id === state[key]) || environments.find(item => item.type === type);
    }

    const taiji = `<div class="taiji" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#27ad9e" stroke="#ffffff" stroke-width="4"/><path d="M50 3a47 47 0 0 1 0 94 23.5 23.5 0 0 1 0-47 23.5 23.5 0 0 0 0-47Z" fill="#3563e9"/><circle cx="50" cy="26.5" r="7" fill="#27ad9e"/><circle cx="50" cy="73.5" r="7" fill="#3563e9"/></svg></div>`;

    function pageTitle(title, copy, actions = '') {
      return `<div class="page-head"><div><h1>${title}</h1><p>${copy}</p></div><div class="head-actions">${actions}</div></div>`;
    }

    function attentionRows() {
      return `<div class="attention-list"><div class="attention-row"><span class="badge red">失败</span><div><strong>构建任务 build-1048 执行失败</strong><p>swmfrontendservice · master · 上海构建环境</p></div><button class="button small">查看</button></div><div class="attention-row"><span class="badge amber">待确认</span><div><strong>2 个产物等待部署确认</strong><p>生产容器环境 · mae 命名空间</p></div><button class="button small">处理</button></div><div class="attention-row"><span class="badge amber">告警</span><div><strong>production-mae 存在 1 个异常工作负载</strong><p>OSMU 状态已同步 · 3 分钟前</p></div><button class="button small">进入运维</button></div></div>`;
    }

    function activityRows() {
      return `<div class="activity-list"><div class="activity-row"><span class="activity-time">10:42</span><div><strong>release-0828 构建完成</strong><p>swmfrontendservice/master、fmemateservice/master</p></div><span class="badge green">成功</span></div><div class="activity-row"><span class="activity-time">10:16</span><div><strong>user-service 部署完成</strong><p>生产容器环境 · OM om-prod-01</p></div><span class="badge green">已部署</span></div><div class="activity-row"><span class="activity-time">09:58</span><div><strong>构建环境连接恢复</strong><p>上海构建环境 · build-01</p></div><span class="badge">资源</span></div></div>`;
    }

    function taskBadge(task) {
      const className = task.status === 'failed' ? 'red' : task.status === 'running' ? 'brand' : 'green';
      return `<span class="badge ${className}">${escapeHtml(task.statusLabel)}</span>`;
    }

    function recentTasks() {
      const rows = tasks.slice(0, 5).map(task => `<div class="task-row"><strong>${escapeHtml(task.id)}</strong><span>${escapeHtml(task.input)}</span><span>${escapeHtml(task.environment)}</span><span>${taskBadge(task)}</span><span>${escapeHtml(task.updated)}</span></div>`).join('');
      return `<section class="panel task-table"><div class="panel-head"><h2>最近任务</h2><button class="button small ghost">查看全部任务</button></div><div class="task-row head"><span>任务</span><span>输入</span><span>环境</span><span>状态</span><span>更新时间</span></div>${rows}</section>`;
    }

    function createTask(kind, input, environment, statusLabel = '执行中') {
      const id = `${kind}-${Date.now()}`;
      tasks.unshift({ id, kind, input, environment, status: 'running', statusLabel, updated: '刚刚' });
      state.page = 'dashboard';
      render();
      showToast(`已创建任务 ${id}`);
      setTimeout(() => {
        const task = tasks.find(item => item.id === id);
        if (!task) return;
        task.status = 'success';
        task.statusLabel = kind === 'deploy' ? '已部署' : '成功';
        task.updated = '刚刚';
        render(false);
      }, 1800);
    }

    function createBuildTask(mode = 'single') {
      const environment = selectedEnvironment('build');
      if (!environment) {
        showToast('请先配置构建环境');
        return;
      }
      createTask('build', mode === 'compare' ? '双分支对比构建' : '2 个业务仓 · master', environment.name);
    }

    function createDeployTask() {
      const environment = selectedEnvironment('container');
      if (!environment) {
        showToast('请先配置容器环境');
        return;
      }
      createTask('deploy', 'user-service · a82f91', environment.name, '部署中');
    }

    }

    function businessRepositories() {
      return `<div class="repo-list"><div class="repo-row"><div><div class="repo-row-title"><span>业务仓</span><button class="button small ghost">移除</button></div><input value="swmfrontendservice"></div><div><span>业务分支</span><input value="master"></div></div><div class="repo-row"><div><div class="repo-row-title"><span>业务仓</span><button class="button small ghost">移除</button></div><input value="fmproductfrontendservice"></div><div><span>业务分支</span><input value="master"></div></div></div>`;
    }

    function singleBuildForm() {
      return `<section class="panel"><div class="panel-head"><div><h2>构建输入</h2><p style="color:var(--muted);margin-top:3px;font-size:12px">分支为空时使用 master</p></div><span class="badge green">已校验</span></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Chart 工具分支</label><input value="master"></div><div class="field"><label>ArchDesign 分支</label><input value="master"></div></div>${businessRepositories()}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px"><button class="button ghost">＋ 添加业务仓</button><button class="button primary" data-create-build-task="single">开始构建</button></div></div></section>`;
    }

    function compareBuildForm() {
      return `<div class="resource-grid"><section class="panel"><div class="panel-head"><h2>基准版本 A</h2><span class="badge violet">左侧</span></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Chart 工具分支</label><input value="master"></div><div class="field"><label>ArchDesign 分支</label><input value="master"></div></div>${businessRepositories()}</div></section><section class="panel"><div class="panel-head"><h2>验证版本 B</h2><span class="badge green">右侧</span></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Chart 工具分支</label><input value="feature/cache"></div><div class="field"><label>ArchDesign 分支</label><input value="master"></div></div>${businessRepositories()}</div></section></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="button primary" data-create-build-task="compare">并发构建并对比</button></div>`;
    }

    function buildConfig() {
      const environment = selectedEnvironment('build');
      const version = releaseVersions.find(item => item.id === environment.version);
      return `<div class="resource-grid"><section class="panel"><div class="panel-head"><h2>仓库与命令</h2><span class="badge green">已保存</span></div><div class="panel-body"><div class="form-grid"><div class="field"><label>Chart 工具仓</label><input value="git.example.com/chart-tool.git"></div><div class="field"><label>Chart 工具分支</label><input value="master"></div><div class="field"><label>ArchDesign 仓</label><input value="git.example.com/arch-design.git"></div><div class="field"><label>ArchDesign 分支</label><input value="master"></div><div class="field"><label>构建命令</label><input value="./build_tool build"></div></div></div></section><section class="panel"><div class="panel-head"><h2>当前构建环境</h2><button class="button small" data-page="resources">打开资源中心</button></div><div class="panel-body"><h3>${escapeHtml(environment.name)}</h3><p style="margin-top:6px;color:var(--muted)">${version.code} · ${version.name} · ${escapeHtml(environment.workdir)}</p><div class="connection-grid"><div class="connection"><span>SSH</span><strong class="mono">${environment.user}@${escapeHtml(environment.ip)}</strong></div><div class="connection"><span>系统架构</span><strong>${environment.architecture === 'aarch64' ? 'ARM' : 'x86'}</strong></div><div class="connection"><span>状态</span><strong class="status ${statusPresentation[environment.status].className}">${statusPresentation[environment.status].label}</strong></div></div></div></section></div>`;
    }

    function buildContent() {
      const body = state.buildTab === 'single' ? singleBuildForm() : state.buildTab === 'compare' ? compareBuildForm() : buildConfig();
      const result = `<div class="summary-stack"><section class="panel"><div class="panel-head"><div><h2>执行状态</h2><p style="color:var(--muted);margin-top:3px;font-size:12px">[build_tool] 生成产物</p></div><span class="badge brand">执行中 62%</span></div><div class="panel-body"><div class="progress"><span></span></div></div></section><section class="panel"><div class="panel-head"><h2>实时日志</h2><button class="button small ghost">展开</button></div><div class="panel-body"><div class="terminal"><b>10:42:01</b> [checkout] swmfrontendservice/master<br><b>10:42:04</b> [checkout] fmemateservice/master<br>10:42:18 [build_tool] generating charts<br>10:42:26 [render] validating output</div></div></section></div>`;
      return `${environmentBar()}${buildTabs()}${state.buildTab === 'single' ? `<div class="build-layout">${body}${result}</div>` : `${body}${state.buildTab !== 'config' ? `<div style="margin-top:16px">${result}</div>` : ''}`}`;
    }

    function selectedReleaseVersion() {
      return releaseVersions.find(item => item.id === state.resourceVersion) || releaseVersions[0];
    }

    function versionEnvironments(type = null) {
      return environments.filter(item => item.version === state.resourceVersion && (!type || item.type === type));
    }

    function visibleEnvironments() {
      const query = state.resourceQuery.trim().toLowerCase();
      return versionEnvironments(state.resourceType).filter(item => (state.resourceStatus === 'all' || item.status === state.resourceStatus) && (!query || `${item.name} ${item.ip} ${item.workdir}`.toLowerCase().includes(query)));
    }

    function environmentStatus(environment) {
      const presentation = statusPresentation[environment.status];
      return `<span class="status ${presentation.className}">${presentation.label}</span>`;
    }

    function versionOverview() {
      const current = selectedReleaseVersion();
      const items = versionEnvironments(state.resourceType);
      const online = items.filter(item => item.status === 'online').length;
      const failed = items.filter(item => item.status === 'error').length;
      return `<section class="environment-summary"><div class="environment-version-card"><label for="release-version">版本</label><select id="release-version" aria-label="版本" ${state.batch || testTokens.size ? 'disabled' : ''}>${releaseVersions.map(item => `<option value="${item.id}" ${item.id === current.id ? 'selected' : ''}>${item.code} · ${escapeHtml(item.name)}</option>`).join('')}</select></div><div class="environment-summary-stat"><span>环境总数</span><strong>${items.length}</strong><small>当前类型</small></div><div class="environment-summary-stat success"><span>可连接</span><strong>${online}</strong><small>最近测试成功</small></div><div class="environment-summary-stat ${failed ? 'danger' : ''}"><span>连接失败</span><strong>${failed}</strong><small>${failed ? '需要检查' : '当前无异常'}</small></div></section>`;
    }

    function environmentTable() {
      const items = visibleEnvironments();
      const locked = selectedReleaseVersion().locked;
      if (!items.length) return `<div class="environment-empty"><h2>没有匹配的环境</h2><p style="margin-top:5px">${locked ? '历史版本为只读，可调整筛选条件查看已有环境。' : '调整筛选条件，或在当前发布版本下新增环境。'}</p></div>`;
      return `<div class="environment-table"><div class="environment-row head"><span>环境</span><span>SSH 地址</span><span>系统架构</span><span>连接状态</span><span>最近测试</span><span style="text-align:right">操作</span></div>${items.map(item => { const unavailable = locked || Boolean(state.batch) || Boolean(testTokens.size); return `<div class="environment-row"><div class="environment-row-name"><span class="environment-kind-icon">${item.type === 'build' ? '构' : '容'}</span><div><strong>${escapeHtml(item.name)}</strong><span class="mono">${escapeHtml(item.workdir)}</span></div></div><div><strong class="mono">${escapeHtml(item.ip)}:${escapeHtml(item.port)}</strong><span class="environment-cell-copy">${item.user}</span></div><div><span class="badge ${item.architecture === 'aarch64' ? 'violet' : 'brand'}">${item.architecture === 'aarch64' ? 'ARM' : 'x86'}</span></div><div>${environmentStatus(item)}</div><div><strong>${escapeHtml(item.lastTest)}</strong><span class="environment-cell-copy">${escapeHtml(item.latency)}</span></div><div class="environment-actions"><button class="button small" data-test-environment="${item.id}" ${unavailable ? 'disabled' : ''}>测试连接</button><button class="button small ghost" data-edit-environment="${item.id}" ${unavailable ? 'disabled' : ''}>编辑</button><button class="button small ghost" data-history-environment="${item.id}">记录</button><select class="environment-filter" data-more-environment="${item.id}" aria-label="更多操作" ${unavailable ? 'disabled' : ''}><option value="">更多</option><option value="copy">复制 SSH 命令</option><option value="delete">删除环境</option></select></div></div>`; }).join('')}</div>`;
    }

    function deleteEnvironment(environment) {
      if (!environment || testTokens.has(environment.id)) return;
      if (selectedReleaseVersion().locked) {
        showToast('历史版本环境为只读');
        return;
      }
      if (!confirm(`确定删除“${environment.name}”吗？删除后无法恢复。`)) return;
      const index = environments.findIndex(item => item.id === environment.id);
      if (index < 0) return;
      environments.splice(index, 1);
      if (state.selectedBuildEnvironment === environment.id) state.selectedBuildEnvironment = '';
      if (state.selectedContainerEnvironment === environment.id) state.selectedContainerEnvironment = '';
      render(false);
      showToast('环境已删除');
    }

    function environmentEditor() {
      if (!state.resourceDrawer) return '';
      const { mode, id } = state.resourceDrawer;
      const source = id ? environments.find(item => item.id === id) : null;
      if (mode === 'history' && source) {
        const history = source.history.length ? source.history.map(item => `<div class="history-item"><time>${escapeHtml(item.time)}</time><div><strong>${item.status === 'online' ? '连接成功' : '连接失败'}</strong><p>${escapeHtml(item.copy)}</p></div><span class="badge ${item.status === 'online' ? 'green' : 'red'}">${item.status === 'online' ? '成功' : '失败'}</span></div>`).join('') : `<div class="environment-empty">这个环境还没有连接测试记录。</div>`;
        return `<div class="drawer-backdrop" data-close-drawer></div><aside class="environment-drawer"><div class="drawer-header"><div><h2>连接测试记录</h2><p>${escapeHtml(source.name)} · ssh ${source.user}@${escapeHtml(source.ip)}</p></div><button class="button ghost" data-close-drawer>关闭</button></div><div class="drawer-body"><div class="history-list">${history}</div></div></aside>`;
      }
      const editing = mode === 'edit';
      const type = source?.type || state.resourceDrawer.type || state.resourceType;
      const version = source?.version || state.resourceVersion;
      const user = type === 'build' ? 'huawei' : 'sopuser';
      const title = editing ? `编辑${type === 'build' ? '构建环境' : '容器环境'}` : `新增${type === 'build' ? '构建环境' : '容器环境'}`;
      const sshPasswordCopy = editing && source?.sshPasswordConfigured ? '已配置；留空表示不修改' : '请输入独立密码';
      const containerPasswordCopy = configured => editing && configured ? '已配置；留空表示不修改' : '请输入独立密码';
      const name = source?.name || '';
      const typeField = !editing ? `<div class="field"><label>环境类型</label><select id="environment-type-selector"><option value="build" ${type === 'build' ? 'selected' : ''}>构建环境</option><option value="container" ${type === 'container' ? 'selected' : ''}>容器环境</option></select></div>` : '';
      return `<div class="drawer-backdrop" data-close-drawer></div><aside class="environment-drawer"><div class="drawer-header"><div><h2>${title}</h2><p>${editing ? '密码独立维护；已配置密码不会在页面中回显。' : '新环境必须设置独立密码。'}</p></div><button class="button ghost" data-close-drawer>关闭</button></div><form id="environment-form" class="drawer-body" data-environment-id="${editing ? source?.id || '' : ''}" data-environment-type="${type}"><section class="drawer-section"><div class="drawer-section-title"><h3>基本信息</h3></div><div class="drawer-grid">${typeField}<div class="field wide"><label>环境名称</label><input name="name" required value="${escapeHtml(name)}" placeholder="例如：${selectedReleaseVersion().name} ${type === 'build' ? '构建环境 01' : '容器环境 01'}"></div><div class="field"><label>发布版本</label><select name="version">${releaseVersions.map(item => `<option value="${item.id}" ${item.id === version ? 'selected' : ''} ${item.locked ? 'disabled' : ''}>${item.code} · ${item.name}${item.locked ? ' · 只读' : ''}</option>`).join('')}</select></div><div class="field"><label>系统架构</label><select name="architecture"><option value="x86_64" ${source?.architecture !== 'aarch64' ? 'selected' : ''}>x86</option><option value="aarch64" ${source?.architecture === 'aarch64' ? 'selected' : ''}>ARM</option></select></div></div></section><section class="drawer-section"><div class="drawer-section-title"><h3>SSH 连接</h3><p>测试连接只验证 SSH 能否登录。</p></div><div class="drawer-grid"><div class="field"><label>${type === 'container' ? 'OM 节点 IP' : 'IP 地址'}</label><input name="ip" required value="${escapeHtml(source?.ip || '')}" placeholder="10.20.12.31"></div><div class="field"><label>SSH 端口</label><input name="port" required value="${escapeHtml(source?.port || '22')}"></div><div class="field"><label>固定用户</label><div class="readonly-value mono">${user}</div></div><div class="field"><label>密码</label><input name="password" type="password" ${editing ? '' : 'required'} placeholder="${sshPasswordCopy}"></div><div class="field wide"><label>工作目录</label><input name="workdir" required value="${escapeHtml(source?.workdir || '')}" placeholder="/opt/cok"></div></div><div id="drawer-test-result" class="drawer-test-result" aria-live="polite"></div></section>${type === 'container' ? `<section class="drawer-section"><div class="drawer-section-title"><h3>容器连接</h3><p>MAE 与 OSMU 分别维护，不纳入 SSH 连接测试。</p></div><div class="drawer-grid"><div class="field"><label>MAE 地址</label><input name="mae" value="${escapeHtml(source?.mae || '')}" placeholder="mae-prod-01"></div><div class="field"><label>MAE 账号</label><input name="maeUser" value="${escapeHtml(source?.maeUser || '')}" placeholder="请输入账号"></div><div class="field wide"><label>MAE 密码</label><input name="maePassword" type="password" ${editing ? '' : 'required'} placeholder="${containerPasswordCopy(source?.maePasswordConfigured)}"></div><div class="field"><label>OSMU 地址</label><input name="osmu" value="${escapeHtml(source?.osmu || '')}" placeholder="osmu-prod-01"></div><div class="field"><label>OSMU 账号</label><input name="osmuUser" value="${escapeHtml(source?.osmuUser || '')}" placeholder="请输入账号"></div><div class="field wide"><label>OSMU 密码</label><input name="osmuPassword" type="password" ${editing ? '' : 'required'} placeholder="${containerPasswordCopy(source?.osmuPasswordConfigured)}"></div></div></section>` : ''}</form><div class="drawer-footer"><button class="button" data-close-drawer>取消</button><button class="button" data-drawer-test>测试连接</button><button class="button primary" data-save-environment>保存环境</button></div></aside>`;
    }

    function resourceContent() {
      const buildCount = versionEnvironments('build').length;
      const containerCount = versionEnvironments('container').length;
      const batch = state.batch ? `<div class="batch-progress"><strong>正在测试 ${state.batch.completed}/${state.batch.total}</strong><div class="batch-progress-track"><span style="width:${state.batch.total ? state.batch.completed / state.batch.total * 100 : 0}%"></span></div><span>${state.batch.passed} 成功 · ${state.batch.failed} 失败</span></div>` : '';
      const locked = selectedReleaseVersion().locked;
      const testing = Boolean(state.batch) || Boolean(testTokens.size);
      return `<div class="resource-workspace">${versionOverview()}<section class="panel resource-panel"><div class="resource-tabs"><button data-resource-type="build" class="${state.resourceType === 'build' ? 'active' : ''}" ${testing ? 'disabled' : ''}>构建环境<span class="resource-tab-count">${buildCount}</span></button><button data-resource-type="container" class="${state.resourceType === 'container' ? 'active' : ''}" ${testing ? 'disabled' : ''}>容器环境<span class="resource-tab-count">${containerCount}</span></button></div><div class="environment-toolbar"><input id="environment-search" class="environment-search" value="${escapeHtml(state.resourceQuery)}" placeholder="搜索名称、IP 或工作目录" ${testing ? 'disabled' : ''}><select id="environment-status" class="environment-filter" ${testing ? 'disabled' : ''}><option value="all">全部状态</option>${Object.entries(statusPresentation).map(([value,item]) => `<option value="${value}" ${state.resourceStatus === value ? 'selected' : ''}>${item.label}</option>`).join('')}</select><span class="environment-toolbar-spacer"></span><button class="button" data-test-all ${testing || locked ? 'disabled' : ''}>测试全部</button><button class="button primary" data-new-environment ${testing || locked ? 'disabled' : ''}>新增${state.resourceType === 'build' ? '构建环境' : '容器环境'}</button></div>${batch}${environmentTable()}</section></div>${environmentEditor()}`;
    }

    function commonPage(page) {
      if (page === 'build') return `${pageTitle('构建', '选择构建环境，配置仓库与分支，然后生成可部署产物。','<button class="button" data-page="resources">查看环境</button>')}${buildContent()}`;
      if (page === 'resources') return `${pageTitle('环境管理', '按发布版本维护构建与容器环境，集中验证 SSH 连通性。')}${resourceContent()}`;
      if (page === 'deploy') return `${pageTitle('部署', '选择成功产物和容器环境，完成校验后部署。')}${containerEnvironmentBar()}<section class="panel empty"><div><div class="empty-symbol">⇧</div><h2>选择待部署产物</h2><p>部署只使用当前容器环境；当前可部署产物 2 个。</p><button class="button primary" style="margin-top:18px" data-create-deploy-task>选择产物</button></div></section>`;
      if (page === 'operations') return `${pageTitle('容器运维', '通过容器环境中的 MAE、OSMU 和唯一 OM 节点执行运维操作。')}${containerEnvironmentBar()}<section class="panel empty"><div><div class="empty-symbol">◇</div><h2>容器运维工作区</h2><p>具体工作负载、日志和操作能力将在后续需求中定义。</p><button class="button" data-page="resources" style="margin-top:18px">查看容器环境</button></div></section>`;
      return '';
    }

    function navIcon(name) {
      const paths={home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',build:'m12 3 9 5-9 5-9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5',deploy:'M12 16V3m-5 5 5-5 5 5M4 14v6h16v-6',resources:'M4 4h16v6H4Zm0 10h16v6H4ZM7 7h1m-1 10h1',operations:'M3 12h4l3-8 4 16 3-8h4',tools:'M4 4h6v6H4Zm10 0h6v6h-6ZM4 14h6v6H4Zm10 0h6v6h-6Z',tasks:'M8 5h12M8 12h12M8 19h12M3 5h1m-1 7h1m-1 7h1',schedules:'M12 8v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0'};
      return `<svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.home}"/></svg>`;
    }
    function dashboardA() {
      const running=tasks.filter(t=>t.status==='running'),failed=tasks.filter(t=>t.status==='failed');
      const online=environments.filter(e=>e.status==='online').length;
      const quick=[['build','构建','从仓库与分支生成可部署产物。'],['deploy','部署','选择产物，完成检查并发布到环境。'],['operations','服务资源','查看容器环境与服务资源。'],['resources','环境管理','维护环境信息，检查 SSH 连接。']];
      const metric=[['当前执行',running.length,'本次会话任务'],['需要处理',failed.length,'本次会话失败任务'],['可连接环境',online,'最近一次连接检查'],['已配置环境',environments.length,'构建与容器环境']];
      return `<div class="home-workbench"><header class="home-welcome"><div><span class="home-eyebrow">容器运维 / 工作台</span><h1>从这里开始今天的工作</h1><p>构建、部署与环境管理，一处直达。</p></div><span class="home-context">统一基础设施工作台</span></header><section class="home-shortcuts" aria-label="常用功能">${quick.map(([id,title,copy])=>`<button class="home-shortcut" data-page="${id}"><span class="home-shortcut-icon">${navIcon(id)}</span><strong>${title}</strong><span>${copy}</span><span class="home-shortcut-link">进入${title}<span aria-hidden="true"> →</span></span></button>`).join('')}</section><section class="home-metrics" aria-label="执行与环境概况">${metric.map(([title,value,copy])=>`<div><span>${title}</span><strong>${value}</strong><small>${copy}</small></div>`).join('')}</section><div class="home-columns"><section class="panel home-panel"><div class="panel-head"><h2>最近任务</h2><span class="home-caption">本次会话</span></div>${tasks.length?`<div class="home-task-list">${tasks.slice(0,6).map(t=>`<button class="home-task" data-page="${t.kind==='build'?'build':'deploy'}"><span class="home-task-copy"><strong>${escapeHtml(t.input)}</strong><small>${escapeHtml(t.environment)} · ${escapeHtml(t.id)}</small></span>${taskBadge(t)}<span class="home-caption">${escapeHtml(t.updated)}</span></button>`).join('')}</div>`:'<div class="home-empty"><span class="home-empty-icon">'+navIcon('tasks')+'</span><h3>还没有任务记录</h3><p>发起构建或部署后，在这里查看本次会话的任务。</p><button class="button" data-page="build">新建构建</button></div>'}</section><section class="panel home-panel"><div class="panel-head"><h2>环境概况</h2><button class="qw-link" data-page="resources">管理环境 →</button></div><div class="home-environments">${[['build','构建环境'],['container','容器环境']].map(([type,title])=>{const items=environments.filter(e=>e.type===type);return `<button data-resource-card="${type}"><span class="home-env-icon">${navIcon(type==='build'?'build':'resources')}</span><span><strong>${title}</strong><small>${items.length} 个环境 · ${items.filter(e=>e.status==='online').length} 个可连接</small></span><span aria-hidden="true">→</span></button>`;}).join('')}<p class="home-caption">连接状态以最近一次测试结果为准。</p></div></section></div></div>`;
    }

    const autoUtStatus = {
      DISCOVERED: '待执行', WAITING_REPOSITORY: '仓库未配置', PREPARING: '准备工作区', BASELINE_RUNNING: '基线测试',
      REPAIRING: '修复中', VERIFYING: '验证中', WAITING_CONFIRMATION: '等待继续', RETRY_PENDING: '等待重试', WAITING_EXTERNAL: '等待处理',
      PR_CREATING:'创建 MR',MR_PENDING:'MR 待合入',MR_REPAIRING:'流水线修复中',MR_CLOSED:'MR 已关闭',NO_CHANGE:'无需治理',RESOLVED:'MR 已合入'
    };
    const autoUtStage = { PREPARE: '准备工作区', BASELINE: '基线 UT', REPAIR: 'Pi 修复', VERIFY: '完整验证', PUBLISH: '创建 CodeHub MR', TRACK:'MR 跟踪与合入', DONE: '已完成' };

    let autoUtPollTimer;

    const autoUtEventSources = new Map();

    function autoUtLiveState(taskId) {

    function captureAutoUtView() {

    function bindAutoUtView() {

      panel.querySelector('.auto-ut-live-head').innerHTML=next.querySelector('.auto-ut-live-head').innerHTML;
      const conversation=feed.querySelector('.auto-ut-conversation'),nextConversation=nextFeed.querySelector('.auto-ut-conversation');
      if(conversation&&nextConversation){
        const existing=new Map([...conversation.querySelectorAll('[data-ut-event]')].map(node=>[node.dataset.utEvent,node]));
        let cursor=conversation.firstElementChild;
        for(const incoming of [...nextConversation.children]){
          const previous=existing.get(incoming.dataset.utEvent);
          let node=previous||incoming;

            const detail=previous.querySelector('details'),nextDetail=incoming.querySelector('details');

                const part=detail.querySelector(selector),nextPart=nextDetail.querySelector(selector);

    function recordAutoUtEntry(live,event) {

      }
      if(live.entries.length>160)live.entries.splice(0,live.entries.length-160);
    }

    function trimAutoUtOutput(value) {
      return value.length > 60000 ? value.slice(-60000) : value;
    }

    function applyAutoUtLiveEvent(taskId, event) {
      const live = autoUtLiveState(taskId);
      if (event.sequence && event.sequence <= live.sequence) return;
      live.sequence = Math.max(live.sequence, event.sequence || 0);
      recordAutoUtEntry(live,event);
      if (event.type === 'prompt') { live.prompt = event.content || ''; live.promptAttempt = event.toolCallId || ''; live.status = '任务已发送给 Pi'; if(!workspaceUi.taskDetailTab&&(!workspaceUi.selectedTaskId||workspaceUi.selectedTaskId===taskId))workspaceUi.taskDetailTab='pi'; }
      if (event.type === 'thinking_start') { live.thinkingActive = true; }
      if (event.type === 'thinking_delta') live.thinking = trimAutoUtOutput(live.thinking + (event.content || ''));
      if (event.type === 'thinking_end') live.thinkingActive = false;
      if (event.type === 'message_delta') live.message = trimAutoUtOutput(live.message + (event.content || ''));
      if (event.type === 'status' || event.type === 'completed') live.status = event.content || live.status;
      if (event.type === 'error') { live.status = event.content || 'Pi 执行失败'; live.error = true; }

        operation.status = event.error ? '失败' : '完成';
        operation.error = Boolean(event.error);
        live.status = event.error ? `${operation.name}失败` : `${operation.name}完成`;
      }
      if (event.type === 'tool_start') {
        live.status = `正在调用 ${event.toolName || '工具'}`;
        live.tools[event.toolCallId] = { id: event.toolCallId, name: event.toolName, args: event.content, output: '', status: '执行中', error: false };

    function connectAutoUtStream(taskId) {
      if (typeof EventSource !== 'function' || autoUtEventSources.has(taskId)) return;
      const after = state.autoUtLive[taskId]?.sequence || 0;
      const source = new EventSource(`/api/auto-ut/tasks/${encodeURIComponent(taskId)}/events?afterSequence=${after}`);

        try { applyAutoUtLiveEvent(taskId, JSON.parse(message.data)); }
        catch (error) { autoUtLiveState(taskId).status = '无法解析 Pi 实时事件'; }

    }

    function ensureAutoUtStreams() {

        if (!streamableIds.has(taskId)) { source.close(); autoUtEventSources.delete(taskId); }

    }

    function closeAutoUtStreams() {

    async function autoUtCall(path, options = {}) {
      const response = await fetch(path, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({message: '请求失败'}));
        throw new Error(body.message || '请求失败');
      }
      if (response.status === 204) return null;
      return response.json();
    }

    async function saveAutoUtRepository(repository) {
      const input = [...document.querySelectorAll('[data-auto-ut-repository-url]')]
        .find(item => item.dataset.autoUtRepositoryUrl === repository);
      const url = input?.value.trim();
      if (!url) return showToast('请输入 CodeHub 仓库地址');
      try {
        const saved = await autoUtCall(`/api/auto-ut/repositories/${encodeURIComponent(repository)}`, {
          method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})
        });
        for (const plan of state.autoUtPlan.filter(item => item.repository === repository)) {
          plan.repositoryUrl = saved.url;
          plan.repositoryCustomized = true;
          plan.configured = plan.version ? Boolean(plan.baseBranch) : true;
        }
        render(false);
        showToast(`${repository} 仓库映射已保存`);
      } catch (error) {
        showToast(error.message || '仓库映射保存失败');
      }
    }

      try {
        const presentation=tasks=>JSON.stringify(tasks.map(({liveEvents,liveSequence,...task})=>task));
        const previous=presentation(state.autoUtTasks);
        state.autoUtTasks = await autoUtCall('/api/auto-ut/tasks');
        const previousGovernance=JSON.stringify(governanceUi);await loadGovernance();
        state.autoUtTasks.forEach(task => (task.liveEvents || []).forEach(event => applyAutoUtLiveEvent(task.id, event)));

      state.autoUtBusy = true;

    function showToast(copy) {

    function copySshCommand(environment) {
      const command = `ssh ${environment.user}@${environment.ip} -p ${environment.port}`;
      const textarea = document.createElement('textarea');
      textarea.value = command;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
      showToast(`已复制：${command}`);
    }

    function finishConnectionTest(environment, token, batchMode = false) {
      if (testTokens.get(environment.id) !== token) return;
      testTokens.delete(environment.id);
      const success = environment.outcome === 'online';
      environment.status = success ? 'online' : 'error';
      environment.lastTest = '刚刚';
      environment.latency = success ? `${72 + environments.indexOf(environment) * 7} ms` : '连接超时';
      environment.history.unshift({ time: '刚刚', status: environment.status, copy: success ? `模拟 SSH 连接成功 · ${environment.latency}` : '模拟连接超时 · 10 秒' });
      if (batchMode && state.batch && state.batch.targetIds.includes(environment.id)) {
        state.batch.completed += 1;
        state.batch[success ? 'passed' : 'failed'] += 1;
        if (state.batch.completed === state.batch.total) {
          const summary = `模拟测试完成：${state.batch.passed} 个成功，${state.batch.failed} 个失败`;
          state.batch = null;
          render(false);
          showToast(summary);
          return;
        }
      }
      render(false);
      if (!batchMode) showToast(success ? `${environment.name} 可以连接` : `${environment.name} 连接失败`);
    }

    function testEnvironment(id) {
      const environment = environments.find(item => item.id === id);
      if (!environment || state.batch || testTokens.has(environment.id)) return;
      const token = Symbol(environment.id);
      testTokens.set(environment.id, token);
      render(false);
      setTimeout(() => finishConnectionTest(environment, token), 700);
    }

    function testAllEnvironments() {
      if (state.batch) return;
      const scoped = versionEnvironments(state.resourceType);
      const targets = scoped.filter(item => !testTokens.has(item.id));
      if (!targets.length) {
        showToast('当前范围没有可测试的环境');
        return;
      }
      state.batch = { version: state.resourceVersion, type: state.resourceType, targetIds: targets.map(item => item.id), total: targets.length, completed: 0, passed: 0, failed: 0 };
      state.resourceStatus = 'all';
      state.resourceQuery = '';
      targets.forEach(item => {
        testTokens.set(item.id, Symbol(item.id));
      });
      render(false);
      targets.forEach((item, index) => {
        const token = testTokens.get(item.id);
        setTimeout(() => finishConnectionTest(item, token, true), 650 + index * 260);
      });
    }

    function saveEnvironment() {
      const form = document.querySelector('#environment-form');
      if (!form || !form.reportValidity()) return;
      const values = Object.fromEntries(new FormData(form));
      const targetVersion = releaseVersions.find(item => item.id === values.version);
      if (!targetVersion || targetVersion.locked) {
        const versionSelect = form.elements.version;
        versionSelect.setCustomValidity('历史版本为只读，请选择可维护版本');
        versionSelect.reportValidity();
        return;
      }
      const existing = environments.find(item => item.id === form.dataset.environmentId);
      const type = form.dataset.environmentType;
      const record = existing || { id: `${type}-${Date.now()}`, type, user: type === 'build' ? 'huawei' : 'sopuser', sshPasswordConfigured: false, status: 'untested', lastTest: '尚未测试', latency: '—', outcome: 'online', history: [] };
      Object.assign(record, { name: values.name, version: values.version, ip: values.ip, port: values.port, workdir: values.workdir, architecture: values.architecture, mae: values.mae || '', maeUser: values.maeUser || '', osmu: values.osmu || '', osmuUser: values.osmuUser || '' });
      if (values.password) record.sshPasswordConfigured = true;
      if (type === 'container') {
        if (values.maePassword) record.maePasswordConfigured = true;
        if (values.osmuPassword) record.osmuPasswordConfigured = true;
      }
      if (!existing) environments.push(record);
      state.resourceVersion = values.version;
      state.resourceType = type;
      state.resourceStatus = 'all';
      state.resourceQuery = '';
      state.resourceDrawer = null;
      render(false);
      showToast(existing ? '环境配置已保存' : '环境已新增');
    }

      document.querySelector('[data-drawer-test]')?.addEventListener('click', () => {
        const form = document.querySelector('#environment-form');
        if (!form) return;
        const password = form.elements.password;
        const fields = [form.elements.ip, form.elements.port];
        if (password.required) fields.push(password);
        const invalid = fields.find(field => !field.checkValidity());

          invalid.reportValidity();

        const user = form.dataset.environmentType === 'build' ? 'huawei' : 'sopuser';
        const result = document.querySelector('#drawer-test-result');

    function mrSettingsForm(){const c=mrUi.draft;if(!c)return '<p class="qw-muted">正在读取 CodeHub 配置…</p>';const people=(key,label)=>`<label class="qw-field"><span>${label}</span><input data-mr-config="roles.${key}" value="${escapeHtml(c.roles[key].join(', '))}" placeholder="多个工号用逗号分隔；留空沿用 CodeHub 默认"></label>`;return `<h3>默认处理人员</h3>${people('reviewers','检视人')}${people('approvers','审核人')}${people('assignees','合并人')}<p class="qw-muted">通知 MR 上实际生效且尚未处理的人员。设置失败会保留 MR 并提示修正。</p><h3>仓库人员覆盖</h3>${c.repositories.map((r,i)=>`<div class="qw-mapping"><label class="qw-field"><span>仓库名</span><input data-mr-repository="${i}" value="${escapeHtml(r.repository)}"></label>${[['reviewers','检视人'],['approvers','审核人'],['assignees','合并人']].map(([k,n])=>`<label class="qw-field"><span>${n}</span><input data-mr-repo-role="${i}" data-role="${k}" value="${escapeHtml(r.roles[k]===undefined?'':r.roles[k].length?r.roles[k].join(', '):'-')}" placeholder="留空继承全局；- 使用 CodeHub 默认"></label>`).join('')}<button type="button" class="qw-link" data-mr-remove="${i}">移除仓库覆盖</button></div>`).join('')}<button type="button" class="button" data-mr-add>添加仓库覆盖</button><h3>跟踪与自动修复</h3><label class="qw-field"><span><input type="checkbox" data-mr-config="autoRepair" ${c.autoRepair?'checked':''}> 自动修复明确的测试失败</span></label><div class="qw-two">${[['maxRepairRounds','最多修复轮次',1,10],['pipelineSeconds','流水线检查间隔（秒）',30,900],['reviewSeconds','人员处理检查间隔（秒）',60,1800],['reminderMinutes','再次提醒间隔（分钟）',10,1440]].map(([k,n,min,max])=>`<label class="qw-field"><span>${n}</span><input type="number" min="${min}" max="${max}" data-mr-config="${k}" value="${c[k]}"></label>`).join('')}</div><h3>WeLink 通知</h3><label class="qw-field"><span><input type="checkbox" data-mr-config="notifications" ${c.notifications?'checked':''}> 开启阶段通知</span></label><label class="qw-field"><span>异常联系人</span><input data-mr-config="contact" value="${escapeHtml(c.contact)}" placeholder="留空使用任务填写的用户名"></label><p class="qw-muted">全天通知，不限制工作日或时段。</p><label class="qw-field"><span>账号映射（每行：CodeHub工号=WeLink账号）</span><textarea id="mr-account-map" rows="4">${escapeHtml(Object.entries(c.welinkAccounts).map(([a,b])=>a+'='+b).join('\n'))}</textarea></label><p class="qw-muted">每阶段首次通知、再次提醒各一次，再超时通知异常联系人一次。运行账户需事先登录 codehub-cli 和 welink-cli；保存配置不会发送测试消息。新配置用于新任务，已有 MR 可单独应用。</p>`;}
    function mrTaskControls(item){if(!item.mr?.iid||item.governance?.mrState!=='PENDING')return '';const m=item.mr,names={SETUP:'完善 MR 信息',PIPELINE:'等待流水线',REVIEW:'等待检视',APPROVE:'等待审核',MERGE:'等待合入'};return `<section class="qw-notice"><strong>${escapeHtml(names[m.phase]||m.phase)}${m.paused?' · 已暂停':''}</strong><p>${escapeHtml(m.error||'MR 合入后任务才会完成。')} · 自动修复 ${m.rounds}/${m.config.maxRepairRounds} 轮</p><div class="head-actions"><button class="button" data-mr-control="${m.paused?'retry':'pause'}" data-task-id="${escapeHtml(item.id)}">${m.paused?'重试当前步骤':'暂停自动处理'}</button><button class="qw-link" data-mr-control="check" data-task-id="${escapeHtml(item.id)}">刷新合入状态</button>${Object.values(m.notifications||{}).some(n=>n.pending)?`<button class="qw-link" data-mr-control="retry-notifications" data-task-id="${escapeHtml(item.id)}">重发未确认通知</button>`:''}<button class="qw-link" data-mr-control="apply-settings" data-task-id="${escapeHtml(item.id)}">应用最新人员配置</button></div></section>`;}

    function qwPlanBlockReason(){if(!state.autoUtPlan.length)return '';return state.autoUtUsername&&state.autoUtWorkspace?'':'请在左下角连接与设置填写用户名和项目路径。';}

      if(d.type==='detail'){const p=qualityUi.job?.parts[d.pi],r=p?.rows[d.ri];title=String(r?.['代码仓']||r?.['组名']||'报告详情');sub=p?`${p.version} · ${qwNames[p.kind]}`:'';body=r?`<div class="qw-tip">${p.kind==='static'?'当前静态检查快照':qualityUi.job.input.latest?'该版本最新报告':`报告日期：${escapeHtml(qualityUi.job.input.date)}`}</div>${Object.entries(r).map(([k,v])=>`<div class="qw-detail-row"><span>${escapeHtml(k)}</span><b>${escapeHtml(v??'—')}</b></div>`).join('')}`:'记录已失效，请重新选择。';}
      if(d.type==='repository'){const p=state.autoUtPlan.find(p=>p.repository===d.repository);title='仓库地址';sub=d.repository;body=p?`<div class="qw-tip">同一仓库的各版本共用地址映射，修改后会持久保存。</div><div><span class="badge ${p.repositoryCustomized?'green':'brand'}">${p.repositoryCustomized?'已保存':'默认仓库'}</span><div class="auto-ut-repository-editor" style="margin-top:16px"><input data-auto-ut-repository-url="${escapeHtml(p.repository)}" value="${escapeHtml(d.value??p.repositoryUrl)}" aria-label="CodeHub 仓库地址"><button type="button" class="button" data-auto-ut-repository-save="${escapeHtml(p.repository)}">保存</button></div></div>`:'仓库不存在';}
      return `<div class="qw-backdrop" data-qw-backdrop><section class="qw-drawer ${d.type==='history'?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="qw-drawer-title"><header class="qw-drawer-head"><div><h2 id="qw-drawer-title">${escapeHtml(title)}</h2><p>${escapeHtml(sub)}</p></div><button class="button ghost" data-qw-close aria-label="关闭" ${workspaceUi.drawerBusy?'disabled':''}>✕</button></header><form id="qw-drawer-form" class="qw-drawer-body" onsubmit="return false">${workspaceUi.drawerError?`<div class="qw-notice" role="alert">${escapeHtml(workspaceUi.drawerError)}</div>`:''}${body}</form><footer class="qw-drawer-foot"><button class="button" data-qw-close ${workspaceUi.drawerBusy?'disabled':''}>${save?'取消':'关闭'}</button>${save?`<button class="button primary" data-qw-save ${workspaceUi.drawerBusy?'disabled':''}>${workspaceUi.drawerBusy?'保存中…':'保存设置'}</button>`:''}</footer></section></div>`;
    }
    function qwOpen(drawer){if(drawer.type==='java-settings'){javaSettingsUi.draft=null;}if(drawer.type==='mr-settings'){mrUi.draft=mrUi.config?JSON.parse(JSON.stringify(mrUi.config)):null;void loadMrSettings();}captureAutoUtInputs();workspaceUi.snapshot={config:JSON.parse(JSON.stringify(reportUi.config)),connection:JSON.parse(JSON.stringify(qualityUi.connection)),username:state.autoUtUsername,ticket:state.autoUtTicket,workspace:state.autoUtWorkspace,reportDirty:workspaceUi.reportDirty,connectionDirty:workspaceUi.connectionDirty};if(drawer.type==='ut-errors'&&workspaceUi.drawerError)utError(workspaceUi.drawerError);workspaceUi.drawer=drawer;workspaceUi.drawerError='';render(false);if(drawer.type==='connection'){void loadDtsSettings();void loadWelinkSettings();}if(drawer.type==='java-settings')void loadJavaSettings();(document.querySelector('.qw-drawer-body input,.qw-drawer-body select')||document.querySelector('[data-qw-close]'))?.focus();}
    function qwClose(saved=false){if(workspaceUi.drawerBusy)return;if(!saved&&workspaceUi.snapshot){const s=workspaceUi.snapshot;reportUi.config=s.config;qualityUi.connection=s.connection;state.autoUtUsername=s.username;state.autoUtTicket=s.ticket;state.autoUtWorkspace=s.workspace;workspaceUi.reportDirty=s.reportDirty;workspaceUi.connectionDirty=s.connectionDirty;}workspaceUi.drawer=null;workspaceUi.snapshot=null;syncVersionTicket();render(false);document.querySelector('[data-qw-drawer]')?.focus();}
    let dtsConfigured=null;
    function dtsConnectionPanel(){return `<h3>DTS 自动建单</h3><p class="qw-muted" id="dts-status">${dtsConfigured===null?'正在读取配置状态…':dtsConfigured?'Token 已配置':'Token 未配置'}</p><label class="qw-field"><span>DTS Token</span><input id="dts-token" type="password" autocomplete="new-password" placeholder="${dtsConfigured?'输入新 Token 以替换':'粘贴 DTS Token'}"></label><div class="head-actions"><button type="button" class="button" id="dts-save" ${workspaceUi.drawerBusy?'disabled':''}>保存 Token</button><button type="button" class="button" id="dts-clear" ${!dtsConfigured||workspaceUi.drawerBusy?'disabled':''}>清除 Token</button></div>`;}
    async function loadDtsSettings(){try{const value=await autoUtCall('/api/auto-ut/dts-settings');dtsConfigured=!!value.configured;const status=document.getElementById('dts-status');if(status)status.textContent=dtsConfigured?'Token 已配置':'Token 未配置';const clear=document.getElementById('dts-clear');if(clear)clear.disabled=!dtsConfigured||workspaceUi.drawerBusy;}catch{const status=document.getElementById('dts-status');if(status)status.textContent='读取 DTS 配置失败，请重新打开设置';}}

    let welinkConfigured=null;
    function welinkConnectionPanel(){return `<h3>WeLink 本人通知（MCP）</h3><p class="qw-muted">通知任务用户本人使用 MCP，其他人使用 CLI。Token 也可从后端 WELINK_TOKEN 环境变量读取。</p><p class="qw-muted" id="welink-status">${welinkConfigured===null?'正在读取配置状态…':welinkConfigured?'Token 已配置':'Token 未配置'}</p><label class="qw-field"><span>WeLink Token</span><input id="welink-token" type="password" autocomplete="new-password" placeholder="${welinkConfigured?'输入新 Token 以替换':'粘贴 WeLink Token'}"></label><div class="head-actions"><button type="button" class="button" id="welink-save" ${workspaceUi.drawerBusy?'disabled':''}>保存 Token</button><button type="button" class="button" id="welink-clear" ${!welinkConfigured||workspaceUi.drawerBusy?'disabled':''}>清除 Token</button></div>`;}
    async function loadWelinkSettings(){try{const value=await autoUtCall('/api/auto-ut/welink-settings');welinkConfigured=!!value.configured;const status=document.getElementById('welink-status');if(status)status.textContent=welinkConfigured?'Token 已配置':'Token 未配置';const clear=document.getElementById('welink-clear');if(clear)clear.disabled=!welinkConfigured||workspaceUi.drawerBusy;}catch{const status=document.getElementById('welink-status');if(status)status.textContent='读取 WeLink 配置失败，请重新打开设置';}}

    let dtsTicketResult=null;
    let selectedTicketVersion='';
    function reportVersionTicket(config,version){const row=config.versions.find(v=>v.version===version);return row?(row.ticket??(config.versions.length===1?config.ticket:'')):'';}
    function currentTicketVersion(){return reportUi.config.versions.find(v=>v.version===selectedTicketVersion)||reportUi.config.versions[0];}
    function syncVersionTicket(){const v=currentTicketVersion();selectedTicketVersion=v?.version||'';state.autoUtTicket=v?reportVersionTicket(reportUi.config,v.version)||'':'';}
    async function releaseCancelledTicket(result){
      if(result.status!=='CANCELLED')return false;
      const version=currentTicketVersion().version;
      if(result.username!==state.autoUtUsername||result.version!==version)throw Error('返回的问题单用户或版本不匹配');
      sessionStorage.removeItem('ut-dts-request:'+state.autoUtUsername+':'+version);
      state.autoUtTicket='';currentTicketVersion().ticket='';reportUi.config.ticket='';workspaceUi.reportDirty=true;
      const input=document.querySelector('#auto-ut-ticket');if(input)input.value='';
      if(workspaceUi.snapshot){workspaceUi.snapshot.ticket='';workspaceUi.snapshot.config.ticket='';const v=workspaceUi.snapshot.config.versions.find(v=>v.version===version);if(v)v.ticket='';workspaceUi.snapshot.reportDirty=true;}
      await saveReportSettings();workspaceUi.drawerError=result.message;showToast(result.message);return true;
    }
    async function controlAutoUtTicket(action,versionArg){
      if(versionArg){selectedTicketVersion=versionArg;syncVersionTicket();}
      if(workspaceUi.drawerBusy)return;
      captureAutoUtInputs();workspaceUi.drawerBusy=true;workspaceUi.drawerError='';render(false);
      try{dtsTicketResult=await autoUtCall('/api/auto-ut/tickets/control',jsonOptions('POST',{ticket:state.autoUtTicket,username:state.autoUtUsername,version:currentTicketVersion().version,reportId:utVersionRun(currentTicketVersion().version)?.id,action}));await loadUtTickets();if(await releaseCancelledTicket(dtsTicketResult))return;if(dtsTicketResult.status==='READY'&&utPage.autoStart&&utVersionPlans(currentTicketVersion().version).some(qwSelectable))await startReportTasks(currentTicketVersion().version);workspaceUi.drawerError=dtsTicketResult.status==='READY'?'':dtsTicketResult.message;showToast(dtsTicketResult.message);}
      catch(e){workspaceUi.drawerError=e.message;}
      finally{workspaceUi.drawerBusy=false;render(false);}
    }
    async function createAutoUtTicket(versionArg){
      if(typeof versionArg==='string'){selectedTicketVersion=versionArg;syncVersionTicket();}
      const block=utCreateBlock(currentTicketVersion().version);if(block){utError(block);render(false);return;}
      if(workspaceUi.drawerBusy)return;
      captureAutoUtInputs();
      if(!/^[A-Za-z0-9._-]+$/.test(state.autoUtUsername)){workspaceUi.drawerError='请先填写用户名';render(false);return;}
      if(state.autoUtTicket){workspaceUi.drawerError='已有问题单号；如需新建，请先清空单号。';render(false);return;}
      const version=currentTicketVersion().version;
      const key='ut-dts-request:'+state.autoUtUsername+':'+version;
      let requestId=sessionStorage.getItem(key);
      if(!requestId){requestId=crypto.randomUUID();sessionStorage.setItem(key,requestId);}
      workspaceUi.drawerBusy=true;workspaceUi.ticketBusy=true;workspaceUi.drawerError='';render(false);
      try{
        await saveReportSettings();
        const result=await autoUtCall('/api/auto-ut/tickets',jsonOptions('POST',{requestId,username:state.autoUtUsername,version,reportId:utVersionRun(version).id}));
        dtsTicketResult=result;
        await loadUtTickets();if(await releaseCancelledTicket(result))return;
        if(result.ticket){state.autoUtTicket=result.ticket;currentTicketVersion().ticket=result.ticket;reportUi.config.ticket=result.ticket;workspaceUi.reportDirty=true;if(workspaceUi.snapshot){workspaceUi.snapshot.ticket=result.ticket;workspaceUi.snapshot.config.ticket=result.ticket;const v=workspaceUi.snapshot.config.versions.find(v=>v.version===version);if(v)v.ticket=result.ticket;workspaceUi.snapshot.reportDirty=true;}}
        if(result.ticket){const input=document.querySelector('#auto-ut-ticket');if(input)input.value=result.ticket;await saveReportSettings();}
        if(result.status==='READY')sessionStorage.removeItem(key);
        await loadUtTickets();if(result.status==='READY'&&utPage.autoStart)await startReportTasks(version);
        workspaceUi.drawerError=result.status==='READY'?'':result.message;if(result.status!=='READY')utError(result.message);
        showToast(result.message);
      }catch(e){utError(e.message||'建单结果未确认，请先在 DTS 查询；再次点击只查询本次请求，不重复建单。');}
      finally{workspaceUi.drawerBusy=false;workspaceUi.ticketBusy=false;render(false);}
    }
    async function qwSave(){const form=document.getElementById('qw-drawer-form');if(form&&!form.reportValidity())return;captureAutoUtInputs();const type=workspaceUi.drawer?.type;if(type==='versions'&&new Set(reportUi.config.versions.map(v=>v.version)).size!==reportUi.config.versions.length){workspaceUi.drawerError='版本不能重复，请检查版本列表。';render(false);return;}workspaceUi.drawerError='';workspaceUi.drawerBusy=true;render(false);try{if(type==='java-settings'){javaSettingsUi.draft=await autoUtCall('/api/automation/language-settings',jsonOptions('PUT',javaSettingsUi.draft));}else if(type==='mr-settings'){mrUi.config=await autoUtCall('/api/auto-ut/mr-settings',jsonOptions('PUT',mrUi.draft));mrUi.draft=null;}else if(type==='managed-schedule'){await saveManagedSchedule();}else if(type==='connection'){qualityUi.connection=await autoUtCall('/api/quality/settings',jsonOptions('PUT',qualityUi.connection));workspaceUi.connectionDirty=false;}else{await saveReportSettings();workspaceUi.reportDirty=false;}workspaceUi.drawerBusy=false;qwClose(true);showToast('设置已保存');}catch(e){workspaceUi.drawerBusy=false;workspaceUi.drawerError=e.message;render(false);showToast(e.message);}}
    function bindWorkspaceInteractions(){
      document.querySelector('#ut-auto-start')?.addEventListener('change',e=>utPage.autoStart=e.target.checked);
      document.querySelectorAll('[data-ut-create]').forEach(el=>el.addEventListener('click',()=>createAutoUtTicket(el.dataset.utCreate)));
      document.querySelectorAll('[data-ut-check]').forEach(el=>el.addEventListener('click',()=>controlAutoUtTicket('check',el.dataset.utCheck)));
      document.querySelectorAll('[data-ut-continue]').forEach(el=>el.addEventListener('click',()=>controlAutoUtTicket('continue',el.dataset.utContinue)));
      document.querySelectorAll('[data-ut-fetch]').forEach(el=>el.addEventListener('click',()=>fetchUtReport([el.dataset.utFetch])));
      document.querySelectorAll('[data-ut-start]').forEach(el=>el.addEventListener('click',()=>startReportTasks(el.dataset.utStart)));
      document.querySelectorAll('[data-version-ticket]').forEach(el=>el.addEventListener('input',()=>{reportUi.config.versions[Number(el.dataset.versionTicket)].ticket=el.value.trim();syncVersionTicket();workspaceUi.reportDirty=true;}));
      document.querySelectorAll('[data-release-mr-block]').forEach(el=>el.addEventListener('click',async()=>{
        const reason=window.prompt('解除后可为该仓库重新治理，可能产生重复 MR；不会关闭或修改远端 MR。请确认已核对并填写解除原因：');if(!reason?.trim())return;
        el.disabled=true;try{await autoUtCall('/api/auto-ut/governance/'+encodeURIComponent(el.dataset.releaseMrBlock)+'/release-block',jsonOptions('POST',{reason:reason.trim()}));await loadGovernance();render(false);showToast('已解除旧记录阻塞，可重新开始治理');}catch(e){el.disabled=false;showToast(e.message);}
      }));
