      if(d.type==='versions'){title='版本与分支';sub='每个版本分别指定基础分支，最多 10 个版本';body=`<div class="qw-tip">保存后重新获取报告，新的版本与分支映射才会进入执行计划。</div>${reportUi.config.versions.map((v,i)=>`<div class="qw-mapping" data-report-version-row="${i}"><div class="qw-two"><label class="qw-field"><span>版本</span><input data-report-version="${i}" value="${escapeHtml(v.version)}" required pattern="[Rr][0-9]{2}[Cc](00|10)" placeholder="R27C10"></label><label class="qw-field"><span>基础分支</span><input data-report-branch="${i}" value="${escapeHtml(v.baseBranch)}" placeholder="例如 release/R27C10"></label></div><button type="button" class="qw-link" data-report-remove="${i}" ${reportUi.config.versions.length===1?'disabled':''}>移除此版本</button></div>`).join('')}<button type="button" class="button" data-report-add ${reportUi.config.versions.length>=10?'disabled':''}>＋ 添加版本</button>`;save=true;}
      if(d.type==='execution'){title='执行设置';sub='配置身份、工作目录与 CSV 基础分支';body=`<div class="qw-tip">在线报告使用“版本与分支”中的映射。修改这些输入后，请重新获取报告。</div><div class="qw-two"><label class="qw-field"><span>用户名</span><input id="auto-ut-username" value="${escapeHtml(state.autoUtUsername)}" required></label><label class="qw-field"><span>单号</span><input id="auto-ut-ticket" value="${escapeHtml(state.autoUtTicket)}" required></label></div><label class="qw-field"><span>基础分支（仅 CSV 导入使用）</span><input id="auto-ut-base-branch" value="${escapeHtml(state.autoUtBaseBranch)}"></label><label class="qw-field"><span>工作目录</span><button type="button" class="auto-ut-workspace" data-auto-ut-workspace-picker><span>📁</span><span>${escapeHtml(state.autoUtWorkspace||'选择工作目录')}</span></button></label><h3>修复范围</h3><p class="qw-muted">Java / Access_智能驾舱组。测试和覆盖率验证通过后创建 CodeHub MR，不自动合并。</p>${reportUi.csv||state.autoUtSchedule?`<h3>原 CSV 定时计划</h3>${autoUtScheduleControl()}`:''}`;save=true;}
      if(d.type==='schedule'){const s=reportUi.config.schedule;title='定时执行';sub='每次重新获取报告，可自动衔接修复';body=`<div class="qw-tip">关闭页面后可继续执行，工具后端需保持运行。错过时间点不补跑。</div><label class="qw-checks"><input type="checkbox" data-report-schedule="enabled" ${s.enabled?'checked':''}>启用定时计划</label><h3>执行时间</h3><div class="qw-two"><label class="qw-field"><span>频率</span><select data-report-schedule="frequency">${[['daily','每天'],['weekdays','工作日'],['weekly','每周']].map(([v,n])=>`<option value="${v}" ${s.frequency===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="qw-field"><span>时间</span><input type="time" required data-report-schedule="time" value="${s.time}"></label></div><label class="qw-field" id="qw-weekday" ${s.frequency==='weekly'?'':'hidden'}><span>星期</span><select data-report-schedule="weekday">${['日','一','二','三','四','五','六'].map((d,i)=>`<option value="${i}" ${s.weekday===i?'selected':''}>星期${d}</option>`).join('')}</select></label><label class="qw-field"><span>时区</span><select data-report-schedule="timezone"><option ${s.timezone==='Asia/Shanghai'?'selected':''}>Asia/Shanghai</option><option ${s.timezone==='UTC'?'selected':''}>UTC</option></select></label><h3>获取后做什么</h3><label class="qw-field"><span>执行方式</span><select data-report-schedule="action"><option value="FETCH" ${s.action==='FETCH'?'selected':''}>仅获取质量报告</option><option value="REPAIR" ${s.action==='REPAIR'?'selected':''}>获取后自动修复并创建 MR</option></select></label><p class="qw-muted">按已保存的全部版本执行。自动修复需要完整的版本分支、用户名、单号和工作目录；已有执行记录的仓库与版本将跳过。</p>`;save=true;}
      if(d.type==='history'){title=state.automationPage==='quality'?'查询历史':'报告获取历史';sub='恢复当时的结果与配置快照';const quality=state.automationPage==='quality';body=`<button class="button small" ${quality?'data-q-history':'data-report-history'}>刷新记录</button>${(quality?qualityUi.history:reportUi.history).slice(0,30).map(r=>`<div class="qw-history-item"><button class="qw-link" ${quality?'data-q-open':'data-report-open'}="${r.id}">${qwDate(r.createdAt)}</button><span class="qw-sub">${escapeHtml((quality?r.input.versions:r.config.versions.map(v=>v.version)).join(' / '))} · ${qwStatuses[r.status]||r.status}${quality?'':` · ${r.trigger==='SCHEDULE'?'定时':'手动'}`}</span></div>`).join('')||qwEmpty('暂无历史记录','执行一次查询后，结果会保存在这里。')}`;}
      if(d.type==='logs'){title='执行记录';sub='查询过程与异常信息';body=state.automationPage==='quality'?`<div class="qw-log-lines">${(qualityUi.job?.parts||[]).map(p=>`${p.version} · ${qwNames[p.kind]}\n${qwStatuses[p.status]}：${p.message}`).map(escapeHtml).join('\n\n')||'暂无查询记录'}</div><p class="qw-muted">${qualityUi.job?'data/logs/quality/'+qualityUi.job.id+'.jsonl':''}</p>`:`<div class="qw-log-lines">${(reportUi.run?.messages||[]).map(escapeHtml).join('\n')||'暂无获取记录'}</div><p class="qw-muted">${reportUi.run?'data/logs/auto-ut/'+reportUi.run.id+'.jsonl':''}</p>`;}
      if(d.type==='export'){title='导出报告';sub='每个版本与检查类型分别导出 CSV';body=(qualityUi.job?.parts||[]).filter(p=>['SUCCEEDED','EMPTY'].includes(p.status)).map(p=>`<div class="qw-detail-row"><div><b>${p.version} · ${qwNames[p.kind]}</b><span class="qw-sub">${p.rows.length} 条异常</span></div><a class="button small" href="/api/quality/jobs/${qualityUi.job.id}/csv?version=${p.version}&kind=${p.kind}">下载 CSV</a></div>`).join('')||qwEmpty('暂无可导出的报告','请等待查询完成。');}
      if(d.type==='detail'){const p=qualityUi.job?.parts[d.pi],r=p?.rows[d.ri];title=String(r?.['代码仓']||r?.['组名']||'报告详情');sub=p?`${p.version} · ${qwNames[p.kind]}`:'';body=r?`<div class="qw-tip">${p.kind==='static'?'当前静态检查快照':`报告日期：${escapeHtml(qualityUi.job.input.date)}`}</div>${Object.entries(r).map(([k,v])=>`<div class="qw-detail-row"><span>${escapeHtml(k)}</span><b>${escapeHtml(v??'—')}</b></div>`).join('')}`:'记录已失效，请重新选择。';}
      if(d.type==='repository'){const p=state.autoUtPlan.find(p=>p.repository===d.repository);title='仓库地址';sub=d.repository;body=p?`<div class="qw-tip">同一仓库的各版本共用地址映射，修改后会持久保存。</div><div><span class="badge ${p.repositoryCustomized?'green':'brand'}">${p.repositoryCustomized?'已保存':'默认仓库'}</span><div class="auto-ut-repository-editor" style="margin-top:16px"><input data-auto-ut-repository-url="${escapeHtml(p.repository)}" value="${escapeHtml(d.value??p.repositoryUrl)}" aria-label="CodeHub 仓库地址"><button type="button" class="button" data-auto-ut-repository-save="${escapeHtml(p.repository)}">保存</button></div></div>`:'仓库不存在';}
      return `<div class="qw-backdrop" data-qw-backdrop><section class="qw-drawer ${d.type==='history'?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="qw-drawer-title"><header class="qw-drawer-head"><div><h2 id="qw-drawer-title">${escapeHtml(title)}</h2><p>${escapeHtml(sub)}</p></div><button class="button ghost" data-qw-close aria-label="关闭" ${workspaceUi.drawerBusy?'disabled':''}>✕</button></header><form id="qw-drawer-form" class="qw-drawer-body" onsubmit="return false">${workspaceUi.drawerError?`<div class="qw-notice" role="alert">${escapeHtml(workspaceUi.drawerError)}</div>`:''}${body}</form><footer class="qw-drawer-foot"><button class="button" data-qw-close ${workspaceUi.drawerBusy?'disabled':''}>${save?'取消':'关闭'}</button>${save?`<button class="button primary" data-qw-save ${workspaceUi.drawerBusy?'disabled':''}>${workspaceUi.drawerBusy?'保存中…':'保存设置'}</button>`:''}</footer></section></div>`;
    }
    function qwOpen(drawer){captureAutoUtInputs();workspaceUi.snapshot={config:JSON.parse(JSON.stringify(reportUi.config)),connection:JSON.parse(JSON.stringify(qualityUi.connection)),username:state.autoUtUsername,ticket:state.autoUtTicket,workspace:state.autoUtWorkspace,branch:state.autoUtBaseBranch,reportDirty:workspaceUi.reportDirty,connectionDirty:workspaceUi.connectionDirty};workspaceUi.drawer=drawer;workspaceUi.drawerError='';render(false);(document.querySelector('.qw-drawer-body input,.qw-drawer-body select')||document.querySelector('[data-qw-close]'))?.focus();}
    function qwClose(saved=false){if(workspaceUi.drawerBusy)return;if(!saved&&workspaceUi.snapshot){const s=workspaceUi.snapshot;reportUi.config=s.config;qualityUi.connection=s.connection;state.autoUtUsername=s.username;state.autoUtTicket=s.ticket;state.autoUtWorkspace=s.workspace;state.autoUtBaseBranch=s.branch;workspaceUi.reportDirty=s.reportDirty;workspaceUi.connectionDirty=s.connectionDirty;}workspaceUi.drawer=null;workspaceUi.snapshot=null;render(false);document.querySelector('[data-qw-drawer]')?.focus();}
    async function qwSave(){const form=document.getElementById('qw-drawer-form');if(form&&!form.reportValidity())return;captureAutoUtInputs();const type=workspaceUi.drawer?.type;if(type==='versions'&&new Set(reportUi.config.versions.map(v=>v.version)).size!==reportUi.config.versions.length){workspaceUi.drawerError='版本不能重复，请检查版本列表。';render(false);return;}workspaceUi.drawerError='';workspaceUi.drawerBusy=true;render(false);try{if(type==='connection'){qualityUi.connection=await autoUtCall('/api/quality/settings',jsonOptions('PUT',qualityUi.connection));workspaceUi.connectionDirty=false;}else{await saveReportSettings();workspaceUi.reportDirty=false;}workspaceUi.drawerBusy=false;qwClose(true);showToast('设置已保存');}catch(e){workspaceUi.drawerBusy=false;workspaceUi.drawerError=e.message;render(false);showToast(e.message);}}
    function bindWorkspaceInteractions(){
      document.querySelectorAll('[data-qw-page]').forEach(el=>el.addEventListener('click',()=>{workspaceUi.drawer=null;state.automationPage=el.dataset.qwPage;closeAutoUtStreams();render();if(state.automationPage==='quality')loadQuality();else{loadAutoUtTasks();loadReportSettings();loadQuality();}}));
      document.querySelectorAll('[data-qw-drawer]').forEach(el=>el.addEventListener('click',()=>{qwOpen({type:el.dataset.qwDrawer});if(el.dataset.qwDrawer==='history'){if(state.automationPage==='quality')loadQuality();else autoUtCall('/api/auto-ut/reports').then(r=>{reportUi.history=r;render(false);}).catch(e=>showToast(e.message));}}));
      document.querySelectorAll('[data-qw-close]').forEach(el=>el.addEventListener('click',()=>qwClose()));document.querySelector('[data-qw-backdrop]')?.addEventListener('click',e=>{if(e.target===e.currentTarget)qwClose();});document.querySelector('[data-qw-save]')?.addEventListener('click',qwSave);
      document.querySelectorAll('[data-qw-pick]').forEach(el=>el.addEventListener('change',()=>{const key=el.dataset.qwPick;qualityUi[key]=[...document.querySelectorAll(`[data-qw-pick="${key}"]:checked`)].map(i=>i.value).join(', ');render(false);}));
      document.querySelectorAll('[data-qw-add]').forEach(el=>el.addEventListener('click',()=>{const key=el.dataset.qwAdd,input=document.getElementById('qw-add-'+key),value=input.value.trim();if(!value)return;if(key==='versions'&&!/^R\d{2}C(?:00|10)$/i.test(value))return showToast('版本格式应为 R27C10 或 R27C00');const list=commaList(qualityUi[key]);const normalized=key==='versions'?value.toUpperCase():value;if(!list.includes(normalized))list.push(normalized);qualityUi[key]=list.join(', ');render(false);}));
      document.querySelectorAll('[data-qw-tab]').forEach(el=>el.addEventListener('click',()=>{qualityUi.kind=el.dataset.qwTab;workspaceUi.issue='';workspaceUi.qualityPage=1;render(false);}));
      document.querySelector('[data-qw-issue]')?.addEventListener('change',e=>{workspaceUi.issue=e.target.value;workspaceUi.qualityPage=1;render(false);});
      document.querySelectorAll('[data-qw-detail]').forEach(el=>el.addEventListener('click',()=>{const[pi,ri]=el.dataset.qwDetail.split('/').map(Number);qwOpen({type:'detail',pi,ri});}));
      document.querySelectorAll('[data-qw-auto-tab]').forEach(el=>el.addEventListener('click',()=>{workspaceUi.autoTab=el.dataset.qwAutoTab;render(false);}));
      for(const [id,key] of [['qw-plan-search','planSearch'],['qw-plan-version','planVersion'],['qw-task-version','taskVersion']])document.getElementById(id)?.addEventListener(id.endsWith('search')?'input':'change',e=>{workspaceUi[key]=e.target.value;workspaceUi.planPage=1;render(false);});
      document.querySelector('#q-search')?.addEventListener('input',e=>{qualityUi.search=e.target.value;workspaceUi.qualityPage=1;render(false);});
      document.querySelectorAll('[data-qw-pager]').forEach(el=>el.addEventListener('click',()=>{workspaceUi[el.dataset.qwPager==='quality'?'qualityPage':'planPage']+=Number(el.dataset.step);render(false);}));
      document.querySelector('[data-qw-select-all]')?.addEventListener('change',e=>{qwPlanEntries().slice((workspaceUi.planPage-1)*20,workspaceUi.planPage*20).filter(qwSelectable).forEach(p=>{const k=p.version+'/'+p.repository;if(e.target.checked)reportUi.selected.add(k);else reportUi.selected.delete(k);});render(false);});
      document.querySelectorAll('[data-report-select]').forEach(el=>el.addEventListener('change',()=>render(false)));
      document.querySelectorAll('[data-qw-repository]').forEach(el=>el.addEventListener('click',()=>qwOpen({type:'repository',repository:el.dataset.qwRepository})));
      document.querySelector('[data-auto-ut-repository-url]')?.addEventListener('input',e=>workspaceUi.drawer.value=e.target.value);
      document.querySelectorAll('[data-q-connection]').forEach(el=>el.addEventListener('input',()=>workspaceUi.connectionDirty=true));
      document.querySelectorAll('[data-report-version],[data-report-branch],[data-report-schedule],[data-report-key],#auto-ut-username,#auto-ut-ticket').forEach(el=>el.addEventListener('input',()=>workspaceUi.reportDirty=true));
      document.querySelector('[data-report-schedule="frequency"]')?.addEventListener('change',e=>{document.getElementById('qw-weekday').hidden=e.target.value!=='weekly';});
      document.querySelectorAll('[data-q-open],[data-report-open]').forEach(el=>el.addEventListener('click',()=>{workspaceUi.drawer=null;workspaceUi.snapshot=null;}));
    }
    document.addEventListener('keydown',event=>{if(!workspaceUi.drawer||state.autoUtDirectory)return;if(event.key==='Escape'){event.preventDefault();qwClose();}if(event.key==='Tab'){const nodes=[...document.querySelectorAll('.qw-drawer button:not(:disabled),.qw-drawer input:not(:disabled),.qw-drawer select:not(:disabled),.qw-drawer a')].filter(el=>!el.closest('[hidden]'));const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});

    render();
  </script>
</body>
</html>
