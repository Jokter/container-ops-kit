    function cleanupScheduleForm(){const s=schedulerUi.draft,t=s.timing;return `<div class="qw-tip">只清理超过保留天数且已结束或等待人工处理的任务。运行中的任务不会删除；任务记录、本地 clone 目录和任务明细日志会一起清理。</div><label class="qw-field"><span>任务名称</span><input required maxlength="100" data-sched-field="name" value="${escapeHtml(s.name)}"></label><label class="qw-checks"><input type="checkbox" data-sched-field="enabled" ${s.enabled?'checked':''}>启用计划</label><h3>何时执行</h3><div class="qw-two"><label class="qw-field"><span>频率</span><select data-sched-time="frequency">${[['daily','每天'],['weekdays','工作日'],['weekly','每周']].map(([v,n])=>`<option value="${v}" ${t.frequency===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="qw-field"><span>时间</span><input required type="time" data-sched-time="time" value="${t.time}"></label></div><label class="qw-field" id="sched-weekday" ${t.frequency==='weekly'?'':'hidden'}><span>星期</span><select data-sched-time="weekday">${['日','一','二','三','四','五','六'].map((d,i)=>`<option value="${i}" ${t.weekday===i?'selected':''}>星期${d}</option>`).join('')}</select></label><label class="qw-field"><span>时区</span><select data-sched-time="timezone"><option ${t.timezone==='Asia/Shanghai'?'selected':''}>Asia/Shanghai</option><option ${t.timezone==='UTC'?'selected':''}>UTC</option></select></label><h3>清理范围</h3><label class="qw-field"><span>任务保留天数</span><input type="number" min="1" max="365" required data-sched-retention value="${s.task.retentionDays}"></label><p class="qw-muted">例如填写 30：每天检查并清理最后更新时间超过 30 天的可清理任务。</p>`;}
    function scheduleForm(){const s=schedulerUi.draft,t=s.timing,task=s.task,c=task.config;return `<div class="qw-tip">保存后统一在“定时任务”管理。暂停只影响后续调度；错过时间点不补跑。</div><label class="qw-field"><span>任务名称</span><input required maxlength="100" data-sched-field="name" value="${escapeHtml(s.name)}"></label><label class="qw-field"><span>所属工具</span><select id="sched-tool" ${schedulerUi.editing?'disabled':''}><option value="quality" ${task.kind==='quality'?'selected':''}>质量检查</option><option value="auto-ut" ${task.kind==='auto-ut'?'selected':''}>UT 治理</option>${task.kind==='csv'?'<option value="csv" selected>UT 治理 · 原 CSV</option>':''}</select></label><label class="qw-checks"><input type="checkbox" data-sched-field="enabled" ${s.enabled?'checked':''}>启用计划</label><h3>何时执行</h3><div class="qw-two"><label class="qw-field"><span>频率</span><select data-sched-time="frequency">${[['daily','每天'],['weekdays','工作日'],['weekly','每周']].map(([v,n])=>`<option value="${v}" ${t.frequency===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="qw-field"><span>时间</span><input required type="time" data-sched-time="time" value="${t.time}"></label></div><label class="qw-field" id="sched-weekday" ${t.frequency==='weekly'?'':'hidden'}><span>星期</span><select data-sched-time="weekday">${['日','一','二','三','四','五','六'].map((d,i)=>`<option value="${i}" ${t.weekday===i?'selected':''}>星期${d}</option>`).join('')}</select></label><label class="qw-field"><span>时区</span><select data-sched-time="timezone"><option ${t.timezone==='Asia/Shanghai'?'selected':''}>Asia/Shanghai</option><option ${t.timezone==='UTC'?'selected':''}>UTC</option></select></label><h3>执行范围</h3>${task.kind==='quality'?`<label class="qw-field"><span>版本（逗号分隔）</span><input required data-sched-quality="versions" value="${escapeHtml(task.query.versions.join(', '))}"></label><label class="qw-field"><span>PL 团队（逗号分隔）</span><input required data-sched-quality="teams" value="${escapeHtml(task.query.teams.join(', '))}"></label><label class="qw-field"><span>业务域</span><input required data-sched-quality="domain" value="${escapeHtml(task.query.domain)}"></label><div class="qw-checks">${Object.entries(qwNames).map(([k,n])=>`<label><input type="checkbox" data-sched-kind="${k}" ${task.query.kinds.includes(k)?'checked':''}>${n}</label>`).join('')}</div><p class="qw-muted">静态检查读取执行时的当前快照。</p>`:task.kind==='auto-ut'?`<div id="sched-versions">${c.versions.map((v,i)=>`<div class="qw-mapping"><div class="qw-two"><label class="qw-field"><span>版本</span><input required data-sched-version="${i}" value="${escapeHtml(v.version)}"></label><label class="qw-field"><span>基础分支</span><input data-sched-branch="${i}" value="${escapeHtml(v.baseBranch)}"></label></div><label class="qw-field"><span>本版本问题单</span><input data-sched-ticket="${i}" value="${escapeHtml(reportVersionTicket(c,v.version)||'')}"></label><button type="button" class="qw-link" data-sched-remove="${i}" ${c.versions.length===1?'disabled':''}>移除</button></div>`).join('')}</div><button type="button" class="button" data-sched-add ${c.versions.length>=10?'disabled':''}>＋ 添加版本</button><label class="qw-field" style="margin-top:14px"><span>执行方式</span><select id="sched-action"><option value="FETCH" ${c.schedule.action==='FETCH'?'selected':''}>仅获取 UT 报告</option><option value="REPAIR" ${c.schedule.action==='REPAIR'?'selected':''}>获取后自动治理并创建 MR</option></select></label><div class="qw-two">${[['username','用户名']].map(([k,n])=>`<label class="qw-field"><span>${n}</span><input data-sched-config="${k}" value="${escapeHtml(c[k])}"></label>`).join('')}</div><label class="qw-field"><span>工作目录（后端所在机器）</span><input data-sched-config="workspaceRoot" value="${escapeHtml(c.workspaceRoot)}"></label><label class="qw-field"><span>每仓库每次最多补充类数</span><input type="number" min="1" max="20" data-sched-config="maxClasses" value="${c.maxClasses??5}"></label><p class="qw-muted" style="margin-top:15px">执行时自动获取每个版本的最新 UT 报告；先核验 UT，按需修复或补测试。</p>`:`<p>来源：${escapeHtml(task.reportFileName)}</p><p class="qw-muted">原 CSV 已迁入统一调度；此计划使用已保存的 CSV，不获取新报告。</p>`}${task.kind==='quality'?`<label class="qw-field" style="margin-top:15px"><span>UT / APITest 报告日期</span><select id="sched-date"><option value="yesterday" ${task.dateMode==='yesterday'?'selected':''}>执行前一天</option><option value="today" ${task.dateMode==='today'?'selected':''}>执行当天</option></select></label>`:''}`;}
    async function saveManagedSchedule(){const s=schedulerUi.draft;if(s.task.kind==='auto-ut-cleanup'){s.task.retentionDays=Number(s.task.retentionDays);if(!Number.isInteger(s.task.retentionDays)||s.task.retentionDays<1||s.task.retentionDays>365)throw Error('任务保留天数必须是 1 至 365 的整数');}else{const versions=s.task.kind==='quality'?s.task.query.versions:s.task.kind==='auto-ut'?s.task.config.versions.map(v=>v.version):[];if(s.task.kind!=='csv'&&(!versions.length||versions.length>10||versions.some(v=>!/^R\d{2}C(?:00|10)$/i.test(v))||new Set(versions.map(v=>v.toUpperCase())).size!==versions.length))throw Error('请填写 1 至 10 个不重复的版本，例如 R27C10、R27C00');if(s.task.kind==='quality'&&!s.task.query.kinds.length)throw Error('至少选择一种检查类型');if(s.task.kind==='auto-ut'&&s.task.config.schedule.action==='REPAIR'){const c=s.task.config;if(!c.username||!c.workspaceRoot||c.versions.some(v=>!v.baseBranch||!reportVersionTicket(c,v.version))||new Set(c.versions.map(v=>reportVersionTicket(c,v.version))).size!==c.versions.length)throw Error('自动修复需填写用户名、单号、工作目录和每个版本的基础分支');}}await autoUtCall('/api/automation/schedules'+(schedulerUi.editing?'/'+schedulerUi.editing:''),jsonOptions(schedulerUi.editing?'PUT':'POST',s));await loadSchedules();}
    async function scheduleOperation(id,operation){const s=schedulerUi.items.find(x=>x.id===id);if(!s||schedulerUi.busy)return;schedulerUi.busy=true;render(false);try{if(operation==='toggle')await autoUtCall('/api/automation/schedules/'+id,jsonOptions('PATCH',{enabled:!s.enabled,revision:s.revision}));if(operation==='run')await autoUtCall('/api/automation/schedules/'+id+'/runs',{method:'POST'});if(operation==='delete')await autoUtCall('/api/automation/schedules/'+id,jsonOptions('DELETE',{revision:s.revision}));await loadSchedules();showToast(operation==='run'?'执行已创建，请查看记录':operation==='delete'?'计划已删除':'计划状态已更新');}catch(e){showToast(e.message);}finally{schedulerUi.busy=false;render(false);}}
    async function openScheduleRuns(id){try{schedulerUi.runs=await autoUtCall('/api/automation/schedules/'+id+'/runs');qwOpen({type:'schedule-runs',id});}catch(e){showToast(e.message);}}
    function scheduleRunsBody(){return `<button type="button" class="button small" data-schedule-runs="${workspaceUi.drawer.id}">刷新记录</button>${schedulerUi.runs.map(r=>`<article class="qw-history-item"><b>${qwDate(r.createdAt)}</b> <span class="badge ${r.status==='FAILED'?'red':r.status==='SUCCEEDED'?'green':''}">${qwStatuses[r.status]||r.status}</span><span class="qw-sub">${r.trigger==='MANUAL'?'立即执行':'定时触发'} · ${r.taskIds.length} 个修复任务</span><pre class="qw-log-lines">${escapeHtml(r.message)}</pre><div class="head-actions">${r.jobId?`<button class="qw-link" data-schedule-quality="${r.jobId}">查看质量报告</button>`:''}${r.reportId?`<button class="qw-link" data-schedule-report="${r.reportId}">查看修复计划与进度</button>`:r.taskIds.length?'<button class="qw-link" data-schedule-tasks>查看修复进度</button>':''}</div></article>`).join('')||qwEmpty('暂无执行记录','到达计划时间或点击“立即执行”后可在这里查看。')}`;}
    async function openScheduleResult(type,id){navigateAutomation(type==='quality'?'quality':'auto-ut');await loadNavigationPage();try{if(type==='quality'){qualityUi.job=await autoUtCall('/api/quality/jobs/'+id);qualityUi.kind=qualityUi.job.input.kinds[0];qualityUi.version='';qualityUi.search='';workspaceUi.issue='';pollQuality();}else{if(id)applyReportRun(await autoUtCall('/api/auto-ut/reports/'+id));await loadAutoUtTasks();workspaceUi.autoTab='tasks';}render(false);}catch(e){showToast(e.message);}}
    function bindSchedules(){
      document.querySelectorAll('[data-automation-nav]').forEach(el=>el.addEventListener('click',()=>{workspaceUi.selectedTaskId='';navigateAutomation(el.dataset.automationNav);}));
      document.querySelectorAll('[data-schedule-new]').forEach(el=>el.addEventListener('click',()=>newSchedule(el.dataset.scheduleNew)));
      document.querySelector('[data-schedule-refresh]')?.addEventListener('click',loadSchedules);
      document.querySelectorAll('[data-schedule-edit]').forEach(el=>el.addEventListener('click',()=>editSchedule(el.dataset.scheduleEdit)));
      for(const op of ['toggle','run'])document.querySelectorAll(`[data-schedule-${op}]`).forEach(el=>el.addEventListener('click',()=>scheduleOperation(el.getAttribute('data-schedule-'+op),op)));
      document.querySelectorAll('[data-schedule-delete]').forEach(el=>el.addEventListener('click',()=>qwOpen({type:'schedule-delete',id:el.dataset.scheduleDelete})));
      document.querySelector('[data-schedule-confirm-delete]')?.addEventListener('click',async()=>{const id=workspaceUi.drawer.id;qwClose(true);await scheduleOperation(id,'delete');});
      document.querySelectorAll('[data-schedule-runs]').forEach(el=>el.addEventListener('click',()=>openScheduleRuns(el.dataset.scheduleRuns)));
      document.querySelectorAll('[data-schedule-quality]').forEach(el=>el.addEventListener('click',()=>openScheduleResult('quality',el.dataset.scheduleQuality)));
      document.querySelectorAll('[data-schedule-report]').forEach(el=>el.addEventListener('click',()=>openScheduleResult('report',el.dataset.scheduleReport)));
      document.querySelector('[data-schedule-tasks]')?.addEventListener('click',()=>openScheduleResult('report'));
      for(const[id,key]of [['schedule-query','query'],['schedule-kind','kind'],['schedule-status','status']])document.getElementById(id)?.addEventListener(key==='query'?'input':'change',e=>{schedulerUi[key]=e.target.value;render(false);});
      document.querySelectorAll('[data-sched-field]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft[el.dataset.schedField]=el.type==='checkbox'?el.checked:el.value));
      document.querySelectorAll('[data-sched-time]').forEach(el=>el.addEventListener('change',()=>{schedulerUi.draft.timing[el.dataset.schedTime]=el.dataset.schedTime==='weekday'?Number(el.value):el.value;if(el.dataset.schedTime==='frequency')document.getElementById('sched-weekday').hidden=el.value!=='weekly';}));
      document.getElementById('sched-tool')?.addEventListener('change',e=>{const old=schedulerUi.draft;newSchedule(e.target.value);schedulerUi.draft.timing=old.timing;schedulerUi.draft.enabled=old.enabled;if(!['每日质量检查','UT 治理计划'].includes(old.name))schedulerUi.draft.name=old.name;render(false);});
      document.querySelectorAll('[data-sched-quality]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.query[el.dataset.schedQuality]=el.dataset.schedQuality==='domain'?el.value:commaList(el.value)));
      document.querySelectorAll('[data-sched-kind]').forEach(el=>el.addEventListener('change',()=>schedulerUi.draft.task.query.kinds=[...document.querySelectorAll('[data-sched-kind]:checked')].map(x=>x.dataset.schedKind)));
      document.querySelectorAll('[data-sched-version]').forEach(el=>el.addEventListener('input',()=>{const v=schedulerUi.draft.task.config.versions[Number(el.dataset.schedVersion)];v.version=el.value.trim().toUpperCase();v.ticket='';delete v.dtsProduct;}));
      document.querySelectorAll('[data-sched-ticket]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.config.versions[Number(el.dataset.schedTicket)].ticket=el.value.trim()));
      document.querySelectorAll('[data-sched-branch]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.config.versions[Number(el.dataset.schedBranch)].baseBranch=el.value.trim()));
      document.querySelectorAll('[data-sched-config]').forEach(el=>el.addEventListener('input',()=>schedulerUi.draft.task.config[el.dataset.schedConfig]=el.value.trim()));
      document.querySelector('[data-sched-retention]')?.addEventListener('input',e=>schedulerUi.draft.task.retentionDays=Number(e.target.value));
      document.querySelectorAll('[data-sched-remove]').forEach(el=>el.addEventListener('click',()=>{schedulerUi.draft.task.config.versions.splice(Number(el.dataset.schedRemove),1);render(false);}));
      document.querySelector('[data-sched-add]')?.addEventListener('click',()=>{schedulerUi.draft.task.config.versions.push({version:'',baseBranch:''});render(false);});
      document.getElementById('sched-action')?.addEventListener('change',e=>schedulerUi.draft.task.config.schedule.action=e.target.value);
      document.getElementById('sched-date')?.addEventListener('change',e=>{if(schedulerUi.draft.task.kind==='quality')schedulerUi.draft.task.dateMode=e.target.value;else schedulerUi.draft.task.config.dateMode=e.target.value;});
    }

    qwStatuses.SKIPPED='已跳过';
    initNavigation();
  </script>
</body>
</html>
